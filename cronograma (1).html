<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ========== VARIÁVEIS E RESET ========== */
    :root {
      --ink: #1B2430;
      --ink-2: #252F3F;
      --paper: #F7F5F0;
      --paper-2: #EFEBE1;
      --amber: #E8A33D;
      --amber-dark: #C4832A;
      --teal: #3E7C82;
      --teal-dark: #2E5F64;
      --rose: #C1666B;
      --rose-dark: #A54F54;
      --green: #4C8A62;
      --green-dark: #3A6B4C;
      --slate: #5C6570;
      --line: #DBD5C6;
      --white: #FFFFFF;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(27,36,48,.08);
    }
    [data-theme="dark"] {
      --ink: #F0EDE8;
      --ink-2: #D5D0C4;
      --paper: #1B2430;
      --paper-2: #252F3F;
      --line: #3A4658;
      --white: #1B2430;
      --slate: #A8B2C0;
      --shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; transition: background .3s, color .3s; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    button { font-family: inherit; cursor: pointer; }
    input,select,textarea { font-family: inherit; }

    /* ========== TOPBAR ========== */
    .ticker { height: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 10px); opacity: .5; }
    .topbar {
      background: var(--ink);
      color: var(--paper);
      padding: 18px clamp(16px,4vw,48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; cursor: default; }
    .brand .idx {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: .12em;
      color: var(--amber);
      border: 1px solid var(--amber);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .brand h1 { font-size: 22px; letter-spacing: -.01em; }
    .brand p { margin: 2px 0 0; font-size: 12.5px; color: #B9C0CC; }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .role-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      background: var(--ink-2);
      border: 1px solid #3A4658;
      color: var(--paper);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .role-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    .role-pill button {
      background: none; border: none; color: #B9C0CC; font-size: 12px; text-decoration: underline;
      padding: 0; margin-left: 6px;

    .save-indicator .saved { color: var(--green); }
    .save-indicator .saving { color: var(--amber); }
    .settings-btn {
      background: none; border: 1px solid #3A4658; border-radius: 6px;
      color: var(--paper); padding: 6px 12px; font-size: 12px;
    }
    .settings-btn:hover { background: rgba(255,255,255,.05); }

      background: none; border: none; color: var(--paper); font-size: 18px;
      position: relative; padding: 4px 6px;
    }

      color: white; font-size: 10px; border-radius: 999px; padding: 1px 5px;
      font-family: 'IBM Plex Mono', monospace;

      border-radius: 999px;

      color: var(--paper);
      font-size: 12px;
      width: 180px;

    .global-search .icon {

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: var(--white); border-radius: var(--radius); max-width: 600px; width: 100%;
      padding: 32px; max-height: 90vh; overflow-y: auto;
      border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .modal h2 { margin-bottom: 20px; }
    .modal .close {
      float: right; background: none; border: none; font-size: 24px; color: var(--slate);
    }
    .modal .close:hover { color: var(--ink); }

    /* ========== LAYOUTS ========== */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px,4vw,48px); }
    .gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .gate-card { max-width: 640px; text-align: center; }
    .gate-card .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .15em; color: var(--teal-dark); text-transform: uppercase; }
    .gate-card h2 { font-size: clamp(28px,4vw,38px); margin: 10px 0 12px; }
    .gate-card p { color: var(--slate); font-size: 15px; line-height: 1.6; margin: 0 0 30px; }
    .gate-options { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .gate-btn {
      width: 260px; text-align: left; background: var(--white);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 22px;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      box-shadow: 0 1px 0 rgba(27,36,48,.03);
    }
    .gate-btn:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 10px 24px rgba(27,36,48,.08); }
    .gate-btn .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; color: var(--amber-dark); text-transform: uppercase; }
    .gate-btn h3 { font-size: 19px; margin: 8px 0 6px; }
    .gate-btn span { font-size: 13.5px; color: var(--slate); }

    .dashboard-wrap { max-width: 1180px; margin: 0 auto; padding: 32px clamp(16px,4vw,48px) 64px; }
    .layout {
      display: grid; grid-template-columns: 350px 1fr; gap: 28px;
    }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
    .full-panel { margin-top: 22px; }

    .panel {
      background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px;
      box-shadow: 0 1px 3px rgba(27,36,48,.05);
    }
    .panel + .panel { margin-top: 22px; }
    .panel h3 {
      font-size: 15px; display: flex; align-items: center; gap: 9px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--line);
    }
    .panel h3 .num {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--white);
      background: var(--teal); border-radius: 5px; padding: 2px 7px;
    }

    /* ========== FORMULÁRIOS ========== */
    label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; color: var(--ink-2); }
    label:first-of-type { margin-top: 0; }
    input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
      width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--paper); font-size: 13.5px; color: var(--ink); outline: none;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal); box-shadow: 0 0 0 3px rgba(62,124,130,.15);
    }
    textarea { resize: vertical; min-height: 64px; }
    .hint { font-size: 11.5px; color: var(--slate); margin-top: 5px; }
    .err { font-size: 11.5px; color: var(--rose-dark); margin-top: 5px; display: none; }
    .ok-msg { font-size: 11.5px; color: var(--green-dark); margin-top: 5px; }
    .radio-row { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
    .radio-row label { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; margin: 0; color: var(--ink); }
    .radio-row input { width: auto; }

    .btn {
      border: none; border-radius: 7px; padding: 11px 16px; font-size: 13.5px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 7px;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn-primary { background: var(--ink); color: var(--paper); width: 100%; justify-content: center; margin-top: 16px; }
    .btn-primary:hover { background: var(--ink-2); }
    .btn-amber { background: var(--amber); color: var(--ink); }
    .btn-amber:hover { background: var(--amber-dark); color: var(--white); }
    .btn-teal { background: var(--teal); color: var(--white); }
    .btn-teal:hover { background: var(--teal-dark); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); }
    .btn-sm { padding: 7px 12px; font-size: 12px; }
    .btn-danger { background: var(--rose); color: var(--white); }
    .btn-danger:hover { background: var(--rose-dark); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-warning { background: var(--amber); color: var(--ink); }
    .btn-warning:hover { background: var(--amber-dark); color: var(--white); }
    .btn-success { background: var(--green); color: var(--white); }
    .btn-success:hover { background: var(--green-dark); }

    /* ========== LISTAS ========== */
    .emp-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; gap: 10px;
    }
    .emp-item:last-child { border-bottom: none; }
    .emp-item .who b { display: block; font-size: 13.5px; }
    .emp-item .who span { color: var(--slate); font-size: 12px; }
    .del-btn { background: none; border: none; color: var(--rose-dark); font-size: 11.5px; text-decoration: underline; padding: 0; white-space: nowrap; }
    .empty { color: var(--slate); font-size: 13px; text-align: center; padding: 18px 0; }

    .badge {
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .04em;
      padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    }
    .badge-approved { background: #E4EFE8; color: var(--green-dark); }
    .badge-pending { background: #FBEFDC; color: var(--amber-dark); }
    .badge-suspended { background: #FDE8E8; color: var(--rose-dark); }
    .badge-atrasada { background: #FDE8E8; color: var(--rose-dark); }
    .badge-concluida { background: #E4EFE8; color: var(--green-dark); }
    .badge-andamento { background: #E8F0FE; color: #2A5F8A; }

    .company-card {
      border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      transition: border-color .12s ease;
    }
    .company-card:hover { border-color: var(--teal); }
    .company-card .info b { display: block; font-size: 14px; }
    .company-card .info span { font-size: 12px; color: var(--slate); }

    .tab-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-row .btn { flex: 1; margin-top: 0; }

    /* ========== CALENDÁRIO ========== */
    .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .cal-head h3 { font-size: 18px; border: none; padding: 0; margin: 0; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px;
      width: 30px; height: 30px; font-size: 14px; color: var(--ink);
    }
    .cal-nav button:hover { background: var(--line); }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
    .cal-dow {
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--slate);
      text-align: center; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 4px;
    }
    .cal-day {
      aspect-ratio: 1/0.85; border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 4px;
      background: var(--paper); cursor: pointer; display: flex; flex-direction: column; position: relative;
      transition: border-color .15s ease, background .15s ease;
    }
    .cal-day.muted { opacity: .35; pointer-events: none; }
    .cal-day:hover { border-color: var(--teal); }
    .cal-day.selected { border-color: var(--ink); background: var(--paper-2); }
    .cal-day.today .num { color: var(--teal-dark); }
    .cal-day .num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-all { background: var(--amber); }
    .dot-one { background: var(--rose); }
    .dot-personal { background: var(--teal); }
    .dot-task { background: var(--green); }

    .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--slate); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .cal-dot { width: 7px; height: 7px; }

    .agenda-title {
      font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .08em;
      color: var(--slate); text-transform: uppercase; margin: 22px 0 10px;
    }
    .event-card {
      border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 10px; background: var(--paper);
    }
    .event-card.individual { border-left-color: var(--rose); }
    .event-card.task-card { border-left-color: var(--green); }
    .event-card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .event-card h4 { font-size: 14px; margin-bottom: 3px; }
    .event-card .time { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--teal-dark); white-space: nowrap; }
    .event-card p { font-size: 13px; color: var(--slate); margin: 6px 0 0; line-height: 1.5; }
    .event-card .target {
      display: inline-block; margin-top: 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      padding: 2px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2);
    }
    .event-card .rm { background: none; border: none; color: var(--rose-dark); font-size: 11px; text-decoration: underline; margin-top: 8px; }

    /* ========== ESTATÍSTICAS ========== */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 14px; text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: var(--teal-dark); }
    .stat-card .label { font-size: 11px; color: var(--slate); text-transform: uppercase; letter-spacing: .05em; }

    /* ========== TAREFAS ========== */
    .task-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line); gap: 12px;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item .info h5 { font-size: 14px; margin: 0; font-family: 'Space Grotesk', sans-serif; }
    .task-item .info p { font-size: 12px; color: var(--slate); margin: 4px 0 0; }
    .task-item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .task-item .meta .badge { font-size: 10px; }

    /* ========== NOTIFICAÇÕES ========== */
    .notif-list { max-height: 300px; overflow-y: auto; }
    .notif-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px;
    }
    .notif-item .msg { font-size: 13px; }
    .notif-item .msg small { display: block; font-size: 11px; color: var(--slate); margin-top: 2px; }
    .notif-item .actions { display: flex; gap: 6px; }

    /* ========== DEV CONTROL CENTER ========== */
    .dev-layout {
      display: flex; gap: 24px; align-items: flex-start;
    }
    .dev-sidebar {
      flex: 0 0 220px;
      background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; position: sticky; top: 20px;
    }
    .dev-sidebar a {
      display: block; padding: 8px 12px; border-radius: 6px; color: var(--ink);
      text-decoration: none; font-size: 13px; margin-bottom: 4px;
    }
    .dev-sidebar a:hover { background: var(--paper-2); }
    .dev-sidebar a.active { background: var(--ink); color: var(--paper); }
    .dev-content { flex: 1; min-width: 0; }

    /* ========== RESPONSIVIDADE ========== */
    @media (max-width: 700px) {
      .topbar .brand p { display: none; }
      .global-search input { width: 120px; }
      .global-search input:focus { width: 160px; }
      .dev-layout { flex-direction: column; }
      .dev-sidebar { flex: 1 1 auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; }
      .dev-sidebar a { padding: 6px 12px; font-size: 12px; }
    }

    .mobile-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--ink); color: var(--paper);
      padding: 8px 12px; justify-content: space-around; z-index: 999;
      border-top: 1px solid #3A4658;
    }
    .mobile-nav a {
      color: var(--paper); text-decoration: none; font-size: 12px; text-align: center; opacity: .7;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .mobile-nav a.active { opacity: 1; color: var(--amber); }
    .mobile-nav a span { font-size: 18px; }
    @media (max-width: 700px) {
      .mobile-nav { display: flex; }
      body { padding-bottom: 60px; }
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed; bottom: 80px; right: 20px; background: var(--ink); color: var(--paper);
      padding: 12px 20px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow);
      z-index: 2000; animation: slideUp .3s ease; max-width: 300px;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ========== MISC ========== */
    .section-divider { border: none; border-top: 1px solid var(--line); margin: 20px 0 14px; }
    ::selection { background: var(--amber); color: var(--ink); }
    .personal-cal-wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    .personal-cal-left { flex: 1 1 320px; min-width: 260px; }
    .personal-cal-right { flex: 1 1 220px; min-width: 210px; }
    .personal-cal-right .agenda-title { margin-top: 0; }
    .compact-event-row { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .compact-event-row:last-child { border-bottom: none; }
    .compact-event-row .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .compact-event-row h5 { font-size: 13.5px; margin: 0; font-family: 'Space Grotesk', sans-serif; }
    .compact-event-row .time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--teal-dark); white-space: nowrap; }
    .compact-event-row p { font-size: 12.5px; color: var(--slate); margin: 4px 0 0; line-height: 1.45; }
    .compact-event-row .rm { background: none; border: none; color: var(--rose-dark); font-size: 11px; text-decoration: underline; padding: 0; margin-top: 6px; display: inline-block; }
    .login-box { max-width: 460px; margin: 60px auto; }
    .login-box.wide { max-width: 520px; }
    .company-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .company-tabs button {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 13px; font-size: 12.5px; color: var(--ink);
    }
    .company-tabs button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .select-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 7px; }
    .select-header label { margin: 0; }
    .sel-count {
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--teal-dark);
      background: #EAF2F2; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    }
    .check-toolbar { display: flex; gap: 14px; margin-bottom: 8px; }
    .check-toolbar button {
      background: none; border: none; padding: 0; font-size: 11.5px; color: var(--teal-dark);
      text-decoration: underline;
    }
    .checkbox-list {
      max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px;
      padding: 6px; background: var(--paper); display: flex; flex-direction: column; gap: 3px;
    }
    .check-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px;
      cursor: pointer; transition: background .12s ease;
    }
    .check-item:hover { background: var(--paper-2); }
    .check-item input { width: auto; margin: 0; accent-color: var(--teal); flex-shrink: 0; }
    .check-item-info { display: flex; flex-direction: column; font-size: 12.5px; }
    .check-item-info b { font-size: 13px; font-weight: 600; }
    .check-item-info span { font-size: 11.5px; color: var(--slate); }
    .panel-note { font-size: 12px; color: var(--slate); line-height: 1.5; margin-top: 4px; }

    /* ========== TASK FILTERS ========== */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filter-bar button {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 14px; font-size: 12px; color: var(--ink);
    }
    .filter-bar button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* ========== LOGS ========== */
    .log-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; color: var(--slate); }
    .log-item .timestamp { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--teal-dark); white-space: nowrap; }
  </style>
</head>

<script>
/* =========================================================
   PERSISTÊNCIA
   ========================================================= */
const STORAGE_KEY = 'cronograma_app_data_v2';
let saveTimeout = null;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      if (parsed.calDate) state.calDate = new Date(parsed.calDate);
      if (parsed.personalCalDate) state.personalCalDate = new Date(parsed.personalCalDate);
      if (parsed.theme) document.documentElement.setAttribute('data-theme', parsed.theme);
      return true;
    }
  } catch (e) { console.warn('Erro ao carregar dados:', e); }
  return false;
}

function saveState() {
  const data = {
    ...state,
    calDate: state.calDate.toISOString(),
    personalCalDate: state.personalCalDate.toISOString(),
    theme: document.documentElement.getAttribute('data-theme') || 'light'
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    updateSaveIndicator('saved');
  } catch (e) { console.warn('Erro ao salvar:', e); }
}

function scheduleSave() {
  const status = document.getElementById('saveStatus');
  if (status) status.textContent = 'salvando...';
  updateSaveIndicator('saving');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => { saveState(); }, 300);
}

function updateSaveIndicator(st) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  if (st === 'saved') { el.textContent = '✓ salvo'; el.className = 'saved'; }
  else { el.textContent = '⏳ salvando...'; el.className = 'saving'; }
}

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const SC_CITIES = [
  "Araranguá","Balneário Camboriú","Biguaçu","Blumenau","Brusque","Caçador",
  "Camboriú","Canoinhas","Chapecó","Concórdia","Criciúma","Florianópolis",
  "Gaspar","Indaial","Itajaí","Itapema","Jaraguá do Sul","Joinville","Lages",
  "Mafra","Navegantes","Palhoça","Rio do Sul","São Bento do Sul",
  "São Francisco do Sul","São José","Tijucas","Timbó","Tubarão","Videira","Xanxerê"
];

const state = {
  role: null,
  session: null,
  admins: [],
  employees: [],
  memberships: [],
  events: [],
  personalEvents: [],
  tasks: [],
  notifications: [],
  logs: [],
  adminAuthTab: "login",
  employeeAuthTab: "login",
  companySearch: "",
  employeeInviteSearch: "",
  employeeActiveCompanyId: null,
  calDate: new Date(),
  selectedDay: null,
  personalCalDate: new Date(),
  personalSelectedDay: null,
  visits: parseInt(localStorage.getItem('cronograma_visits') || '0') + 1,
  theme: 'light',
  suspendedCompanies: [],
  warnedCompanies: [],
  taskFilter: 'all',
  devTab: 'dashboard'
};

localStorage.setItem('cronograma_visits', String(state.visits));
loadState();

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
function uid() { return Math.random().toString(36).slice(2, 10); }

function maskCPF(v) {
  v = v.replace(/\D/g, "").slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return v;
}

function validarCPF(raw) {
  const cpf = raw.replace(/\D/g, "");
  if (cpf.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(cpf)) return false;
  let soma = 0, resto;
  for (let i = 1; i <= 9; i++) soma += parseInt(cpf[i-1]) * (11 - i);
  resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[9])) return false;
  soma = 0;
  for (let i = 1; i <= 10; i++) soma += parseInt(cpf[i-1]) * (12 - i);
  resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[10])) return false;
  return true;
}

function isValidGmail(email) { return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email.trim()); }

function fmtDateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDatePretty(key) {
  const [y,m,d] = key.split("-");
  return `${d}/${m}/${y}`;
}
const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW_PT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function eventsForDay(list, key) { return list.filter(e => e.data === key).sort((a,b)=> a.hora.localeCompare(b.hora)); }

function currentAdmin() { return state.admins.find(a => a.id === state.session?.adminId) || null; }
function currentEmployee() { return state.employees.find(e => e.id === state.session?.employeeId) || null; }
function membershipOf(employeeId, companyId) {
  return state.memberships.find(m => m.employeeId === employeeId && m.companyId === companyId) || null;
}
function approvedEmployeesOf(companyId) {
  return state.memberships.filter(m => m.companyId === companyId && m.status === "approved")
    .map(m => state.employees.find(e => e.id === m.employeeId)).filter(Boolean);
}
function pendingIncomingRequestsOf(companyId) {
  return state.memberships.filter(m => m.companyId === companyId && m.status === "pending" && m.origin === "employee");
}
function pendingInvitesSentOf(companyId) {
  return state.memberships.filter(m => m.companyId === companyId && m.status === "pending" && m.origin === "admin");
}
function personalEventsOf(ownerType, ownerId) {
  return state.personalEvents.filter(e => e.ownerType === ownerType && e.ownerId === ownerId);
}
function approvedCompaniesOf(employeeId) {
  return state.memberships.filter(m => m.employeeId === employeeId && m.status === "approved")
    .map(m => state.admins.find(a => a.id === m.companyId)).filter(Boolean);
}
function eventsVisibleToEmployeeInCompany(employeeId, companyId) {
  return state.events.filter(e => e.companyId === companyId &&
    (e.tipo === "todos" || (e.tipo === "especificos" && e.destinatarios.includes(employeeId))));
}
function isCompanySuspended(companyId) { return state.suspendedCompanies.includes(companyId); }
function isCompanyWarned(companyId) { return state.warnedCompanies.includes(companyId); }

function addLog(action, details = "") {
  const user = currentAdmin() || currentEmployee() || { nome: "Sistema" };
  state.logs.unshift({
    id: uid(),
    timestamp: new Date().toISOString(),
    usuario: user.nome || "Sistema",
    acao: action,
    detalhes: details
  });
  if (state.logs.length > 200) state.logs = state.logs.slice(0, 200);
  scheduleSave();
}

function addNotification(recipientType, recipientId, message, tipo = "info") {
  state.notifications.push({
    id: uid(),
    recipientType,
    recipientId,
    message,
    tipo,
    lida: false,
    createdAt: new Date().toISOString()
  });
  scheduleSave();
}

function unreadNotificationsCount(userId, userType) {
  return state.notifications.filter(n => n.recipientId === userId && n.recipientType === userType && !n.lida).length;
}

function getNotifications(userId, userType) {
  return state.notifications.filter(n => n.recipientId === userId && n.recipientType === userType)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function showToast(msg, duration = 3000) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

/* =========================================================
   RENDER RAIZ
   ========================================================= */
function render() {
  const app = document.getElementById("app");
  const roleBox = document.getElementById("roleIndicator");
  const devAdmin = state.session?.type === 'devadmin';

  // Atualizar badge de notificações
  const badge = document.getElementById('notifBadge');
  if (state.session) {
    const userId = state.session.adminId || state.session.employeeId;
    const userType = state.session.type === 'admin' ? 'admin' : 'funcionario';
    const count = unreadNotificationsCount(userId, userType);
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline' : 'none';
  } else {
    badge.style.display = 'none';
  }

  if (devAdmin) {
    roleBox.innerHTML = rolePillHTML("🔧 Dev Admin");
    app.innerHTML = renderGlobalAdminDashboard();
    bindGlobalAdminEvents();
    return;
  }

  if (!state.role) {
    roleBox.innerHTML = "";
    app.innerHTML = renderGate();
    return;
  }

  if (state.role === "admin" && !state.session) {
    roleBox.innerHTML = rolePillHTML("Administrador");
    app.innerHTML = renderAdminAuthGate();
    bindAdminAuthEvents();
    return;
  }
  if (state.role === "admin" && state.session) {
    const adm = currentAdmin();
    if (!adm) { state.session = null; render(); return; }
    roleBox.innerHTML = rolePillHTML(adm.nomeEmpresa);
    app.innerHTML = renderAdminDashboard(adm);
    bindAdminDashboardEvents(adm);
    return;
  }

  if (state.role === "funcionario" && !state.session) {
    roleBox.innerHTML = rolePillHTML("Funcionário");
    app.innerHTML = renderEmployeeAuthGate();
    bindEmployeeAuthEvents();
    return;
  }
  if (state.role === "funcionario" && state.session) {
    const emp = currentEmployee();
    if (!emp) { state.session = null; render(); return; }
    roleBox.innerHTML = rolePillHTML("Funcionário — " + emp.nome.split(" ")[0]);
    app.innerHTML = renderEmployeeDashboard(emp);
    bindEmployeeDashboardEvents(emp);
    return;
  }
}

function rolePillHTML(label) {
  return `<div class="role-pill"><span class="dot"></span>${label}
    <button id="switchRoleBtn">sair</button></div>`;
}
document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "switchRoleBtn") {
    state.role = null; state.session = null; state.selectedDay = null;
    state.companySearch = ""; state.employeeInviteSearch = ""; state.employeeActiveCompanyId = null;
    state.adminAuthTab = "login"; state.employeeAuthTab = "login"; state.personalSelectedDay = null;
    scheduleSave(); render();
  }
});

/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').style.display = 'flex';
  const user = currentAdmin() || currentEmployee();
  if (user && user.cidade) document.getElementById('settingsCity').value = user.cidade;
});
document.getElementById('closeSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').style.display = 'none';
});
document.getElementById('settingsModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('settingsModal').style.display = 'none';
});

document.getElementById('themeLight').addEventListener('click', () => {
  document.documentElement.removeAttribute('data-theme');
  state.theme = 'light'; scheduleSave();
});
document.getElementById('themeDark').addEventListener('click', () => {
  document.documentElement.setAttribute('data-theme', 'dark');
  state.theme = 'dark'; scheduleSave();
});

document.getElementById('changePasswordBtn').addEventListener('click', () => {
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmNewPassword').value;
  const msg = document.getElementById('passwordMsg');
  if (newPass.length < 6) { msg.textContent = '❌ Mínimo 6 caracteres.'; msg.style.color = 'var(--rose-dark)'; return; }
  if (newPass !== confirmPass) { msg.textContent = '❌ Senhas não coincidem.'; msg.style.color = 'var(--rose-dark)'; return; }
  const user = currentAdmin() || currentEmployee();
  if (!user) { msg.textContent = '❌ Nenhum usuário logado.'; return; }
  if (state.session?.type === 'admin') {
    const adm = state.admins.find(a => a.id === user.id);
    if (adm) { adm.senha = newPass; scheduleSave(); msg.textContent = '✅ Senha alterada!'; msg.style.color = 'var(--green-dark)'; }
  } else {
    msg.textContent = '✅ Funcionários usam CPF como autenticação.';
    msg.style.color = 'var(--green-dark)';
  }
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmNewPassword').value = '';
});

document.getElementById('settingsCity').addEventListener('change', function() {
  const user = currentAdmin() || currentEmployee();
  if (user) { user.cidade = this.value; scheduleSave(); showToast('📍 Localidade atualizada!'); }
});

/* =========================================================
   NOTIFICAÇÕES
   ========================================================= */
document.getElementById('notifBtn').addEventListener('click', () => {
  document.getElementById('notifModal').style.display = 'flex';
  renderNotifications();
});
document.getElementById('closeNotif').addEventListener('click', () => {
  document.getElementById('notifModal').style.display = 'none';
});
document.getElementById('notifModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('notifModal').style.display = 'none';
});

function renderNotifications() {
  const container = document.getElementById('notifList');
  if (!state.session) { container.innerHTML = '<div class="empty">Nenhuma notificação.</div>'; return; }
  const userId = state.session.adminId || state.session.employeeId;
  const userType = state.session.type === 'admin' ? 'admin' : 'funcionario';
  const notifs = getNotifications(userId, userType);
  if (notifs.length === 0) {
    container.innerHTML = '<div class="empty">Nenhuma notificação.</div>';
    return;
  }
  container.innerHTML = notifs.map(n => `
    <div class="notif-item" style="${n.lida ? 'opacity:0.6;' : ''}">
      <div class="msg">
        ${n.message}
        <small>${new Date(n.createdAt).toLocaleString()}</small>
      </div>
      <div class="actions">
        ${!n.lida ? `<button class="btn btn-sm btn-ghost" data-mark-read="${n.id}">✓</button>` : ''}
        <button class="del-btn" data-delete-notif="${n.id}">✕</button>
      </div>
    </div>
  `).join('');
  // event listeners
  container.querySelectorAll('[data-mark-read]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-mark-read');
      const notif = state.notifications.find(n => n.id === id);
      if (notif) { notif.lida = true; scheduleSave(); renderNotifications(); }
    });
  });
  container.querySelectorAll('[data-delete-notif]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-delete-notif');
      state.notifications = state.notifications.filter(n => n.id !== id);
      scheduleSave(); renderNotifications();
    });
  });
}

document.getElementById('markAllRead').addEventListener('click', () => {
  if (!state.session) return;
  const userId = state.session.adminId || state.session.employeeId;
  state.notifications.forEach(n => { if (n.recipientId === userId) n.lida = true; });
  scheduleSave(); renderNotifications();
});
document.getElementById('clearNotifs').addEventListener('click', () => {
  if (!state.session) return;
  const userId = state.session.adminId || state.session.employeeId;
  state.notifications = state.notifications.filter(n => n.recipientId !== userId);
  scheduleSave(); renderNotifications();
});

/* =========================================================
   PESQUISA GLOBAL
   ========================================================= */
document.getElementById('globalSearchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    performSearch();
  }
});
document.getElementById('globalSearchInput').addEventListener('focus', function() {
  if (this.value.trim().length > 0) performSearch();
});

function performSearch() {
  const term = document.getElementById('globalSearchInput').value.trim().toLowerCase();
  if (term.length < 2) { showToast('Digite pelo menos 2 caracteres.'); return; }
  const results = [];
  // Funcionários
  state.employees.forEach(e => {
    if (e.nome.toLowerCase().includes(term) || e.cpf.includes(term)) {
      results.push({ tipo: 'Funcionário', nome: e.nome, detalhe: e.cpf + ' · ' + (e.cidade || '') });
    }
  });
  // Empresas
  state.admins.forEach(a => {
    if (a.nomeEmpresa.toLowerCase().includes(term) || a.nomeAdmin.toLowerCase().includes(term)) {
      results.push({ tipo: 'Empresa', nome: a.nomeEmpresa, detalhe: 'Admin: ' + a.nomeAdmin });
    }
  });
  // Eventos
  state.events.forEach(e => {
    if (e.titulo.toLowerCase().includes(term) || e.descricao?.toLowerCase().includes(term)) {
      const comp = state.admins.find(a => a.id === e.companyId);
      results.push({ tipo: 'Evento', nome: e.titulo, detalhe: (comp ? comp.nomeEmpresa : '') + ' · ' + e.data });
    }
  });
  // Tarefas
  state.tasks.forEach(t => {
    if (t.titulo.toLowerCase().includes(term) || t.descricao?.toLowerCase().includes(term)) {
      const emp = state.employees.find(e => e.id === t.responsavel);
      results.push({ tipo: 'Tarefa', nome: t.titulo, detalhe: (emp ? emp.nome : '') + ' · ' + t.status });
    }
  });

  const modal = document.getElementById('searchModal');
  const container = document.getElementById('searchResults');
  if (results.length === 0) {
    container.innerHTML = '<div class="empty">Nenhum resultado encontrado.</div>';
  } else {
    container.innerHTML = results.map(r => `
      <div style="padding:8px 0; border-bottom:1px solid var(--line);">
        <span class="badge" style="background:var(--paper-2);">${r.tipo}</span>
        <strong>${r.nome}</strong> <span style="color:var(--slate);font-size:12px;">${r.detalhe}</span>
      </div>
    `).join('');
  }
  modal.style.display = 'flex';
}
document.getElementById('closeSearch').addEventListener('click', () => {
  document.getElementById('searchModal').style.display = 'none';
});
document.getElementById('searchModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('searchModal').style.display = 'none';
});

/* =========================================================
   ACESSO GLOBAL DEV
   ========================================================= */
document.querySelector('.brand').addEventListener('dblclick', () => {
  if (state.session?.type === 'devadmin') {
    state.session = null; state.role = null; render(); return;
  }
  const pass = prompt('🔐 Acesso de desenvolvedor - Digite a senha:');
  if (pass === 'dev2024') {
    state.session = { type: 'devadmin' };
    state.role = null;
    render();
    showToast('🔧 Modo desenvolvedor ativado!');

  let content = '';
  if (tab === 'dashboard') {
    content = `

        <div class="stat-card"><div class="num">${totalCompanies}</div><div class="label">Empresas</div></div>
        <div class="stat-card"><div class="num">${totalUsers}</div><div class="label">Usuários</div></div>

        <div class="stat-card"><div class="num">${totalTasks}</div><div class="label">Tarefas</div></div>

  } else if (tab === 'empresas') {
    content = `
      <h4 style="margin-bottom:12px;">Empresas cadastradas</h4>
      ${state.admins.length === 0 ? '<div class="empty">Nenhuma empresa.</div>' :
        state.admins.map(adm => {
          const members = state.memberships.filter(m => m.companyId === adm.id);
          const approved = members.filter(m => m.status === 'approved');
          const suspended = isCompanySuspended(adm.id);
          const warned = isCompanyWarned(adm.id);
          return `
            <div class="company-card" style="${suspended ? 'opacity:0.5;border-color:var(--rose);' : ''}">
              <div class="info">
                <b>${adm.nomeEmpresa}</b>
                <span>Admin: ${adm.nomeAdmin} · ${members.length} membros (${approved.length} aprovados)</span>
                ${suspended ? '<span class="badge badge-suspended">Suspensa</span>' : ''}
                ${warned ? '<span class="badge badge-pending">Alertada</span>' : ''}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-sm btn-danger" data-global-remove="${adm.id}">Remover</button>
                <button class="btn btn-sm btn-warning" data-global-warn="${adm.id}">${warned ? 'Remover alerta' : 'Alertar'}</button>
                <button class="btn btn-sm btn-teal" data-global-suspend="${adm.id}">${suspended ? 'Reativar' : 'Suspender'}</button>
              </div>
            </div>`;
        }).join('')
      }
    `;
  } else if (tab === 'usuarios') {
    content = `
      <h4 style="margin-bottom:12px;">Funcionários cadastrados</h4>
      ${state.employees.length === 0 ? '<div class="empty">Nenhum funcionário.</div>' :
        state.employees.map(emp => {
          const memberships = state.memberships.filter(m => m.employeeId === emp.id);
          const companies = memberships.map(m => state.admins.find(a => a.id === m.companyId)).filter(Boolean);
          return `
            <div class="company-card">
              <div class="info">
                <b>${emp.nome}</b>
                <span>${emp.cpf} · ${emp.cidade || ''} · ${memberships.length} vínculos</span>
              </div>
              <span>${companies.map(c => c.nomeEmpresa).join(', ') || 'Nenhuma'}</span>
            </div>`;
        }).join('')
      }
    `;
  } else if (tab === 'eventos') {
    content = `
      <h4 style="margin-bottom:12px;">Todos os eventos (${state.events.length})</h4>
      ${state.events.length === 0 ? '<div class="empty">Nenhum evento.</div>' :
        state.events.map(ev => {
          const comp = state.admins.find(a => a.id === ev.companyId);
          return `
            <div class="event-card">
              <div class="row">
                <h4>${ev.titulo}</h4>
                <span class="time mono">${ev.hora}</span>
              </div>
              <p>${ev.descricao || ''}</p>
              <span class="target">${comp ? comp.nomeEmpresa : 'Empresa removida'} · ${ev.tipo}</span>
            </div>`;
        }).join('')
      }
    `;
  } else if (tab === 'tarefas') {
    content = `
      <h4 style="margin-bottom:12px;">Todas as tarefas (${state.tasks.length})</h4>
      ${state.tasks.length === 0 ? '<div class="empty">Nenhuma tarefa.</div>' :
        state.tasks.map(t => {
          const resp = state.employees.find(e => e.id === t.responsavel);
          return `
            <div class="task-item">
              <div class="info">
                <h5>${t.titulo}</h5>
                <p>${t.descricao || ''} · Prazo: ${t.prazo} ${t.horario ? t.horario : ''}</p>
              </div>
              <div class="meta">
                <span class="badge ${t.status === 'concluida' ? 'badge-concluida' : t.status === 'atrasada' ? 'badge-atrasada' : t.status === 'andamento' ? 'badge-andamento' : 'badge-pending'}">${t.status}</span>
                <span>${resp ? resp.nome : 'Sem responsável'}</span>
              </div>
            </div>`;
        }).join('')
      }
    `;
  } else if (tab === 'relatorios') {
    const tasksByStatus = { pendente: 0, andamento: 0, concluida: 0, atrasada: 0, cancelada: 0 };
    state.tasks.forEach(t => { if (tasksByStatus[t.status] !== undefined) tasksByStatus[t.status]++; });
    content = `
      <div class="stats-grid">
        <div class="stat-card"><div class="num">${tasksByStatus.concluida}</div><div class="label">Concluídas</div></div>
        <div class="stat-card"><div class="num">${tasksByStatus.andamento}</div><div class="label">Em andamento</div></div>
        <div class="stat-card"><div class="num">${tasksByStatus.atrasada}</div><div class="label">Atrasadas</div></div>
        <div class="stat-card"><div class="num">${tasksByStatus.pendente}</div><div class="label">Pendentes</div></div>
      </div>
      <p>Total de tarefas: ${state.tasks.length}</p>
    `;
  } else if (tab === 'logs') {
    content = `
      <h4 style="margin-bottom:12px;">Histórico de ações</h4>
      ${state.logs.length === 0 ? '<div class="empty">Nenhum log registrado.</div>' :
        state.logs.slice(0, 50).map(log => `
          <div class="log-item">
            <span class="timestamp">${new Date(log.timestamp).toLocaleString()}</span>
            <span><strong>${log.usuario}</strong> — ${log.acao} ${log.detalhes ? ' (' + log.detalhes + ')' : ''}</span>
          </div>
        `).join('')
      }
    `;
  }

  return `
  <div class="dashboard-wrap">
    <div class="dev-layout">
      <div class="dev-sidebar">
        <h4 style="margin-bottom:12px;font-size:14px;">🧠 DEV</h4>
        ${devTabs.map(t => `
          <a href="#" data-dev-tab="${t}" class="${t === tab ? 'active' : ''}">${t.charAt(0).toUpperCase()+t.slice(1)}</a>
        `).join('')}
        <a href="#" id="exitDevMode" style="margin-top:12px;color:var(--rose);">Sair</a>
      </div>
      <div class="dev-content">
        <div class="panel">
          <h3><span class="num">📊</span>${tab.charAt(0).toUpperCase()+tab.slice(1)}</h3>
          ${content}
        </div>
      </div>
    </div>
  </div>`;
}

function bindGlobalAdminEvents() {
  document.querySelectorAll('[data-dev-tab]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      state.devTab = el.getAttribute('data-dev-tab');
      render();
    });
  });

  document.querySelectorAll('[data-global-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-global-remove');
      if (confirm(`Remover empresa e todos os dados associados?`)) {
        state.admins = state.admins.filter(a => a.id !== id);
        state.memberships = state.memberships.filter(m => m.companyId !== id);
        state.events = state.events.filter(e => e.companyId !== id);
        state.tasks = state.tasks.filter(t => t.companyId !== id);
        state.suspendedCompanies = state.suspendedCompanies.filter(c => c !== id);
        state.warnedCompanies = state.warnedCompanies.filter(c => c !== id);
        scheduleSave(); render(); showToast('🗑️ Empresa removida.');
        addLog('DEV', 'Removeu empresa ' + id);
      }
    });
  });

  document.querySelectorAll('[data-global-warn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-global-warn');
      if (state.warnedCompanies.includes(id)) {
        state.warnedCompanies = state.warnedCompanies.filter(c => c !== id);
        showToast('✅ Alerta removido.');
      } else {
        state.warnedCompanies.push(id);
        showToast('⚠️ Empresa alertada!');
        addLog('DEV', 'Alertou empresa ' + id);
      }
      scheduleSave(); render();
    });
  });

  document.querySelectorAll('[data-global-suspend]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-global-suspend');
      if (state.suspendedCompanies.includes(id)) {
        state.suspendedCompanies = state.suspendedCompanies.filter(c => c !== id);
        showToast('✅ Empresa reativada!');
        addLog('DEV', 'Reativou empresa ' + id);
      } else {
        state.suspendedCompanies.push(id);
        showToast('🔒 Empresa suspensa!');
        addLog('DEV', 'Suspendeu empresa ' + id);
      }
      scheduleSave(); render();
    });
  });

  document.getElementById('exitDevMode').addEventListener('click', () => {
    state.session = null; state.role = null; render(); showToast('Saindo do modo desenvolvedor.');
  });
}

function bindAdminAuthEvents() {
  document.querySelectorAll("[data-adm-tab]").forEach(btn => {
    btn.addEventListener("click", () => { state.adminAuthTab = btn.getAttribute("data-adm-tab"); render(); });
  });

  document.getElementById("admLoginBtn")?.addEventListener("click", () => {
    const email = document.getElementById("admLoginEmail").value.trim().toLowerCase();
    const senha = document.getElementById("admLoginSenha").value;
    const errBox = document.getElementById("admLoginErr");
    const adm = state.admins.find(a => a.email.toLowerCase() === email && a.senha === senha);
    if (adm) {
      if (isCompanySuspended(adm.id)) {
        errBox.textContent = "⚠️ Acesso suspenso. Entre em contato com o suporte.";
        errBox.style.display = "block";
        return;
      }
      state.session = { type: "admin", adminId: adm.id };
      scheduleSave(); render();
      showToast(`Bem-vindo(a), ${adm.nomeAdmin}!`);
      addLog('Login', adm.nomeAdmin + ' (' + adm.email + ')');
      addNotification('admin', adm.id, 'Bem-vindo de volta!');
    } else {
      errBox.style.display = "block";
    }
  });

  document.getElementById("admRegBtn")?.addEventListener("click", () => {
    const email = document.getElementById("admRegEmail").value.trim();
    const nomeAdmin = document.getElementById("admRegNome").value.trim();
    const nomeEmpresa = document.getElementById("admRegEmpresa").value.trim();
    const cnpj = document.getElementById("admRegCnpj").value.trim();
    const telefone = document.getElementById("admRegTelefone").value.trim();
    const cidade = document.getElementById("admRegCidade").value;
    const senha = document.getElementById("admRegSenha").value;
    const senha2 = document.getElementById("admRegSenha2").value;
    const errBox = document.getElementById("admRegErr");

    let msg = "";
    if (!isValidGmail(email)) msg = "E-mail Gmail válido.";
    else if (state.admins.some(a => a.email.toLowerCase() === email.toLowerCase())) msg = "E-mail já cadastrado.";
    else if (!nomeAdmin) msg = "Nome do administrador.";
    else if (!nomeEmpresa) msg = "Nome da empresa.";
    else if (!cidade) msg = "Selecione a cidade.";
    else if (senha.length < 6) msg = "Senha mín. 6 caracteres.";
    else if (senha !== senha2) msg = "Senhas não coincidem.";

    if (msg) { errBox.textContent = msg; errBox.style.display = "block"; return; }
    errBox.style.display = "none";
    const novoAdmin = { id: uid(), email, nomeAdmin, nomeEmpresa, senha, cidade, cnpj, telefone };
    state.admins.push(novoAdmin);
    state.session = { type: "admin", adminId: novoAdmin.id };
    scheduleSave(); render();
    showToast(`🎉 Empresa "${nomeEmpresa}" criada!`);
    addLog('Criou empresa', nomeEmpresa);
  });
}

function renderInviteResults(adm) {
  const term = state.employeeInviteSearch.trim().toLowerCase();
  if (term.length < 2) return '<p class="hint">Digite ao menos 2 letras.</p>';
  const cpfDigits = term.replace(/\D/g, "");
  const results = state.employees.filter(emp => {
    const already = state.memberships.some(m => m.employeeId === emp.id && m.companyId === adm.id);
    if (already) return false;
    const nameMatch = emp.nome.toLowerCase().includes(term);
    const cpfMatch = cpfDigits.length >= 3 && emp.cpf.replace(/\D/g, "").includes(cpfDigits);
    return nameMatch || cpfMatch;
  }).slice(0, 8);
  if (results.length === 0) return '<div class="empty">Nenhum funcionário encontrado.</div>';
  return results.map(emp => `
    <div class="emp-item">
      <div class="who">
        <b>${emp.nome}</b>
        <span>${emp.cidade} · ${emp.cpf}</span>
      </div>
      <button class="btn btn-teal btn-sm" data-invite="${emp.id}">Convidar</button>
    </div>
  `).join("");
}

function renderTaskListAdmin(companyId) {
  const tasks = state.tasks.filter(t => t.companyId === companyId);
  const filter = state.taskFilter || 'all';
  const filtered = filter === 'all' ? tasks : tasks.filter(t => t.status === filter);
  if (filtered.length === 0) return '<div class="empty">Nenhuma tarefa.</div>';
  return filtered.map(t => {
    const resp = state.employees.find(e => e.id === t.responsavel);
    return `
      <div class="task-item">
        <div class="info">
          <h5>${t.titulo}</h5>
          <p>${t.descricao || ''} · Prazo: ${t.prazo} ${t.horario || ''} · ${resp ? resp.nome : 'Sem responsável'}</p>
        </div>
        <div class="meta">
          <span class="badge ${t.status === 'concluida' ? 'badge-concluida' : t.status === 'atrasada' ? 'badge-atrasada' : t.status === 'andamento' ? 'badge-andamento' : 'badge-pending'}">${t.status}</span>
          <button class="del-btn" data-delete-task="${t.id}">✕</button>
        </div>
      </div>`;
  }).join('');
}

function bindAdminDashboardEvents(adm) {
  // Solicitações
  document.getElementById("pendingList").addEventListener("click", (e) => {
    const apBtn = e.target.closest("[data-approve]");
    const rjBtn = e.target.closest("[data-reject]");
    if (apBtn) {
      const m = state.memberships.find(x => x.id === apBtn.getAttribute("data-approve"));
      if (m) { m.status = "approved"; scheduleSave(); render(); showToast('✅ Aprovado!'); addLog('Aprovou funcionário', m.employeeId); }
    }
    if (rjBtn) {
      const id = rjBtn.getAttribute("data-reject");
      state.memberships = state.memberships.filter(x => x.id !== id);
      scheduleSave(); render(); showToast('❌ Recusado.');
    }
  });

  document.getElementById("approvedList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-revoke]");
    if (!btn) return;
    const empId = btn.getAttribute("data-revoke");
    state.memberships = state.memberships.filter(m => !(m.employeeId === empId && m.companyId === adm.id));
    state.events = state.events.reduce((acc, ev) => {
      if (ev.companyId === adm.id && ev.tipo === "especificos" && ev.destinatarios.includes(empId)) {
        const restantes = ev.destinatarios.filter(id => id !== empId);
        if (restantes.length === 0) return acc;
        acc.push({ ...ev, destinatarios: restantes });
        return acc;
      }
      acc.push(ev);
      return acc;
    }, []);
    scheduleSave(); render(); showToast('👤 Removido da equipe.');
  });

  const inviteSearchInput = document.getElementById("inviteSearchInput");
  if (inviteSearchInput) {
    inviteSearchInput.addEventListener("input", () => {
      state.employeeInviteSearch = inviteSearchInput.value;
      render();
      const el = document.getElementById("inviteSearchInput");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  document.getElementById("inviteResults")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-invite]");
    if (!btn) return;
    const employeeId = btn.getAttribute("data-invite");
    state.memberships.push({ id: uid(), employeeId, companyId: adm.id, status: "pending", origin: "admin" });
    scheduleSave(); render(); showToast('📨 Convite enviado!');
    addLog('Enviou convite', employeeId);
    addNotification('funcionario', employeeId, 'Você recebeu um convite para entrar em ' + adm.nomeEmpresa);
  });
  document.getElementById("sentInvitesList")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cancel-invite]");
    if (!btn) return;
    const id = btn.getAttribute("data-cancel-invite");
    state.memberships = state.memberships.filter(m => m.id !== id);
    scheduleSave(); render(); showToast('✖️ Convite cancelado.');
  });

  // Eventos
  document.querySelectorAll('input[name="destino"]').forEach(r => {
    r.addEventListener("change", (e) => {
      document.getElementById("individualBlock").style.display = e.target.value === "especificos" ? "block" : "none";
    });
  });
  document.getElementById("evEmpChecklist")?.addEventListener("change", updateSelCount);
  document.getElementById("selAllEmp")?.addEventListener("click", () => {
    document.querySelectorAll(".ev-emp-check").forEach(cb => cb.checked = true);
    updateSelCount();
  });
  document.getElementById("selNoneEmp")?.addEventListener("click", () => {
    document.querySelectorAll(".ev-emp-check").forEach(cb => cb.checked = false);
    updateSelCount();
  });

  document.getElementById("addEventBtn").addEventListener("click", () => {
    const titulo = document.getElementById("evTitulo").value.trim();
    const data = document.getElementById("evData").value;
    const hora = document.getElementById("evHora").value;
    const desc = document.getElementById("evDesc").value.trim();
    const destinoTipo = document.querySelector('input[name="destino"]:checked').value;
    const empIds = Array.from(document.querySelectorAll(".ev-emp-check:checked")).map(el => el.value);
    const errBox = document.getElementById("evErr");
    const destinoValido = destinoTipo === "todos" || (destinoTipo === "especificos" && empIds.length > 0);
    if (!titulo || !data || !hora || !destinoValido) { errBox.style.display = "block"; return; }
    errBox.style.display = "none";
    state.events.push({
      id: uid(), companyId: adm.id, titulo, data, hora, descricao: desc,
      tipo: destinoTipo, destinatarios: destinoTipo === "todos" ? [] : empIds
    });
    state.selectedDay = data;
    scheduleSave(); render();
    showToast('📅 Evento criado!');
    addLog('Criou evento', titulo);
    // Notificar funcionários específicos
    if (destinoTipo === "especificos") {
      empIds.forEach(id => {
        addNotification('funcionario', id, 'Novo evento: ' + titulo + ' em ' + data);
      });
    } else {
      approvedEmployeesOf(adm.id).forEach(emp => {
        addNotification('funcionario', emp.id, 'Novo evento para todos: ' + titulo + ' em ' + data);
      });
    }
  });

  // Tarefas
  document.querySelectorAll('[data-task-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-task-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.taskFilter = btn.getAttribute('data-task-filter');
      render();
    });
  });

  document.getElementById("addTaskBtn").addEventListener("click", () => {
    const titulo = document.getElementById("newTaskTitle").value.trim();
    const desc = document.getElementById("newTaskDesc").value.trim();
    const prazo = document.getElementById("newTaskPrazo").value;
    const horario = document.getElementById("newTaskHorario").value;
    const responsavel = document.getElementById("newTaskResponsavel").value;
    const prioridade = document.getElementById("newTaskPrioridade").value;
    const errBox = document.getElementById("taskErr");
    if (!titulo || !prazo || !responsavel) { errBox.style.display = "block"; return; }
    errBox.style.display = "none";
    const task = {
      id: uid(), companyId: adm.id, titulo, descricao: desc, prazo, horario,
      responsavel, prioridade, status: 'pendente',
      criador: adm.id, criadoEm: new Date().toISOString()
    };
    state.tasks.push(task);
    scheduleSave(); render();
    showToast('✅ Tarefa criada!');
    addLog('Criou tarefa', titulo);
    addNotification('funcionario', responsavel, 'Nova tarefa: ' + titulo + ' (prazo: ' + prazo + ')');
  });

  document.getElementById("taskListAdmin")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-delete-task]");
    if (btn) {
      const id = btn.getAttribute("data-delete-task");
      state.tasks = state.tasks.filter(t => t.id !== id);
      scheduleSave(); render(); showToast('🗑️ Tarefa removida.');
    }
  });

  // Calendário
  document.getElementById('calTodayBtn')?.addEventListener('click', () => {
    state.calDate = new Date();
    state.selectedDay = fmtDateKey(new Date());
    render();
  });
  bindCalendarNav();
  bindEventRemoval();
  bindPersonalAgendaEvents("admin", adm.id);

  // Ações de exclusão de eventos via delegação
  document.getElementById("dayAgenda")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove-event]");
    if (btn) {
      const id = btn.getAttribute("data-remove-event");
      state.events = state.events.filter(ev => ev.id !== id);
      scheduleSave(); render(); showToast('🗑️ Evento removido.');
    }
  });
}

function updateSelCount() {
  const countEl = document.getElementById("selCount");
  if (!countEl) return;
  const n = document.querySelectorAll(".ev-emp-check:checked").length;
  countEl.textContent = `${n} selecionado(s)`;
}

function bindEmployeeAuthEvents() {
  document.querySelectorAll("[data-emp-auth-tab]").forEach(btn => {
    btn.addEventListener("click", () => { state.employeeAuthTab = btn.getAttribute("data-emp-auth-tab"); render(); });
  });

  document.getElementById("empLoginCPF")?.addEventListener("input", function() {
    this.value = maskCPF(this.value);
  });
  document.getElementById("empLoginBtn")?.addEventListener("click", () => {
    const cpf = document.getElementById("empLoginCPF").value;
    const errBox = document.getElementById("empLoginErr");
    const emp = state.employees.find(e => e.cpf === cpf);
    if (emp) {
      state.session = { type: "funcionario", employeeId: emp.id };
      state.selectedDay = null;
      state.employeeActiveCompanyId = null;
      scheduleSave(); render();
      showToast(`👋 Bem-vindo(a), ${emp.nome}!`);
      addLog('Login', emp.nome + ' (' + emp.cpf + ')');
      addNotification('funcionario', emp.id, 'Bem-vindo de volta!');
    } else {
      errBox.style.display = "block";
    }
  });

  document.getElementById("regCPF")?.addEventListener("input", function() {
    this.value = maskCPF(this.value);
  });
  document.getElementById("registerBtn")?.addEventListener("click", () => {
    const nome = document.getElementById("regNome").value.trim();
    const cpf = document.getElementById("regCPF").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const telefone = document.getElementById("regTelefone").value.trim();
    const cidade = document.getElementById("regCidade").value;
    const errBox = document.getElementById("regErr");
    const cpfDigits = cpf.replace(/\D/g, "");

    let msg = "";
    if (!nome) msg = "Nome completo.";
    else if (!cidade) msg = "Selecione a cidade.";
    else if (cpfDigits.length !== 11) msg = "CPF precisa ter 11 dígitos.";
    else if (!validarCPF(cpf)) msg = "CPF inválido.";
    else if (state.employees.some(e => e.cpf === cpf)) msg = "CPF já cadastrado.";
    else if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) msg = "E-mail inválido.";

    if (msg) { errBox.textContent = msg; errBox.style.display = "block"; return; }
    errBox.style.display = "none";
    const novo = { id: uid(), nome, cpf, cidade, email, telefone, status: 'ativo' };
    state.employees.push(novo);
    state.session = { type: "funcionario", employeeId: novo.id };
    state.selectedDay = null;
    scheduleSave(); render();
    showToast(`✅ Cadastro realizado, ${nome}!`);
    addLog('Cadastrou', nome);
  });
}

function renderEmployeeDashboard(emp) {
  const myMemberships = state.memberships.filter(m => m.employeeId === emp.id);

  if (!state.employeeActiveCompanyId && approvedCompanies.length > 0) {
    state.employeeActiveCompanyId = approvedCompanies[0].id;
  }

  const filteredCompanies = state.admins.filter(a =>
    !searchTerm || a.nomeEmpresa.toLowerCase().includes(searchTerm)
  );

  const activeCompany = state.admins.find(a => a.id === state.employeeActiveCompanyId);
  const calendarEvents = activeCompany ? eventsVisibleToEmployeeInCompany(emp.id, activeCompany.id) : [];
  const myTasks = state.tasks.filter(t => t.responsavel === emp.id);
  const tasksCount = { pendente: 0, andamento: 0, concluida: 0, atrasada: 0 };
  myTasks.forEach(t => { if (tasksCount[t.status] !== undefined) tasksCount[t.status]++; });

  return `
  <div class="dashboard-wrap">
    <div style="margin-bottom:16px;">
      <h2 style="font-size:20px;">Olá, ${emp.nome} 👋</h2>
      <p style="color:var(--slate);">Hoje você possui: ${myTasks.length} tarefas, ${calendarEvents.length} eventos, ${tasksCount.atrasada} atrasadas.</p>
    </div>

    <div class="layout" style="grid-template-columns:350px 1fr;">
      <div>
        <div class="panel">
          <h3><span class="num">01</span>Minhas empresas</h3>
          <div id="myMembershipsList">
          ${myMemberships.length === 0 ? '<div class="empty">Nenhuma empresa.</div>' :
            myMemberships.map(m => {
              const company = state.admins.find(a => a.id === m.companyId);
              if (!company) return "";
              let rightHtml;
              if (m.status === "approved") {
                rightHtml = `<span class="badge badge-approved">Aprovado</span>`;
              } else if (m.origin === "admin") {
                rightHtml = `
                  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <span class="badge badge-pending">Convite</span>
                    <button class="btn btn-teal btn-sm" data-accept-invite="${m.id}">Aceitar</button>
                    <button class="del-btn" data-decline-invite="${m.id}">recusar</button>
                  </div>`;
              } else {
                rightHtml = `<span class="badge badge-pending">Aguardando aprovação</span>`;
              }
              return `
                <div class="company-card">
                  <div class="info">
                    <b>${company.nomeEmpresa}</b>
                    <span>${company.nomeAdmin}</span>
                  </div>
                  ${rightHtml}
                </div>`;
            }).join("")
          }

              filteredCompanies.map(c => {
                const m = membershipOf(emp.id, c.id);
                let btnHtml;
                if (isCompanySuspended(c.id)) {
                  btnHtml = `<button class="btn btn-ghost btn-sm" disabled>🔒 Suspensa</button>`;
                } else if (!m) btnHtml = `<button class="btn btn-amber btn-sm" data-request="${c.id}">Solicitar entrada</button>`;
                else if (m.status === "pending" && m.origin === "employee") btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Enviada</button>`;
                else if (m.status === "pending" && m.origin === "admin") btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Convite recebido</button>`;
                else btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Você faz parte</button>`;
                return `
                  <div class="company-card">
                    <div class="info">
                      <b>${c.nomeEmpresa}</b>

function renderTaskListFunc(employeeId) {
  const tasks = state.tasks.filter(t => t.responsavel === employeeId);
  const filter = state.taskFilter || 'all';
  const filtered = filter === 'all' ? tasks : tasks.filter(t => t.status === filter);
  if (filtered.length === 0) return '<div class="empty">Nenhuma tarefa.</div>';
  return filtered.map(t => {
    const criador = state.admins.find(a => a.id === t.criador);
    return `
      <div class="task-item">
        <div class="info">
          <h5>${t.titulo}</h5>
          <p>${t.descricao || ''} · Prazo: ${t.prazo} ${t.horario || ''} · ${criador ? criador.nomeAdmin : 'Admin'}</p>

}
