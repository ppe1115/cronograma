<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Painel da Equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#252F3F;
    --paper:#F7F5F0;
    --paper-2:#EFEBE1;
    --amber:#E8A33D;
    --amber-dark:#C4832A;
    --teal:#3E7C82;
    --teal-dark:#2E5F64;
    --rose:#C1666B;
    --rose-dark:#A54F54;
    --green:#4C8A62;
    --green-dark:#3A6B4C;
    --slate:#5C6570;
    --line:#DBD5C6;
    --white:#FFFFFF;
    --radius:12px;
    --shadow:0 4px 12px rgba(27,36,48,.08);
  }
  [data-theme="dark"]{
    --ink:#F0EDE8;
    --ink-2:#D5D0C4;
    --paper:#1B2430;
    --paper-2:#252F3F;
    --line:#3A4658;
    --white:#1B2430;
    --slate:#A8B2C0;
    --shadow:0 4px 12px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  body{margin:0;transition:background .3s, color .3s;}
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk',sans-serif;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .ticker{
    height:14px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px, transparent 2px 10px);
    opacity:.5;
  }

  .topbar{
    background:var(--ink);
    color:var(--paper);
    padding:22px clamp(16px,4vw,48px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .idx{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--amber);
    border:1px solid var(--amber);
    border-radius:4px;
    padding:2px 6px;
  }
  .brand h1{font-size:22px;letter-spacing:-.01em;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:#B9C0CC;}
  .role-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:var(--ink-2);
    border:1px solid #3A4658;
    color:var(--paper);
    padding:6px 12px;
    border-radius:999px;
    display:flex;align-items:center;gap:8px;
  }
  .role-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .role-pill button{
    background:none;border:none;color:#B9C0CC;font-size:12px;text-decoration:underline;
    padding:0;margin-left:6px;
  }
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .save-indicator{
    font-size:11px;
    color:#B9C0CC;
    font-family:'IBM Plex Mono',monospace;
    display:flex;align-items:center;gap:6px;
  }
  .save-indicator .saved{color:var(--green);}
  .save-indicator .saving{color:var(--amber);}
  .settings-btn{
    background:none;border:1px solid #3A4658;border-radius:6px;
    color:var(--paper);padding:6px 12px;font-size:12px;
  }
  .settings-btn:hover{background:rgba(255,255,255,.05);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px);}

  /* Settings Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal{
    background:var(--white);border-radius:var(--radius);max-width:500px;width:100%;
    padding:32px;max-height:90vh;overflow-y:auto;
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .modal h2{margin-bottom:20px;}
  .modal .close{
    float:right;background:none;border:none;font-size:24px;color:var(--slate);
  }
  .modal .close:hover{color:var(--ink);}

  .gate{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .gate-card{max-width:640px;text-align:center;}
  .gate-card .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.15em;color:var(--teal-dark);text-transform:uppercase;
  }
  .gate-card h2{font-size:clamp(28px,4vw,38px);margin:10px 0 12px;}
  .gate-card p{color:var(--slate);font-size:15px;line-height:1.6;margin:0 0 30px;}
  .gate-options{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  .gate-btn{
    width:260px;text-align:left;background:var(--white);
    border:1px solid var(--line);border-radius:var(--radius);padding:22px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 0 rgba(27,36,48,.03);
  }
  .gate-btn:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 10px 24px rgba(27,36,48,.08);}
  .gate-btn .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    color:var(--amber-dark);text-transform:uppercase;
  }
  .gate-btn h3{font-size:19px;margin:8px 0 6px;}
  .gate-btn span{font-size:13.5px;color:var(--slate);}

  .dashboard-wrap{max-width:1180px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 64px;}
  .layout{
    display:grid;grid-template-columns:350px 1fr;gap:28px;
  }
  @media (max-width: 880px){ .layout{grid-template-columns:1fr;} }
  .full-panel{margin-top:22px;}

  .personal-panel-body{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:16px;}
  .personal-form-col{flex:0 0 300px;min-width:260px;}
  .personal-cal-col{flex:1 1 480px;min-width:320px;}
  @media (max-width: 700px){
    .personal-form-col{flex:1 1 100%;}
    .personal-cal-col{flex:1 1 100%;}
  }

  .panel{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
    box-shadow:0 1px 3px rgba(27,36,48,.05);
  }
  .panel + .panel{margin-top:22px;}
  .panel h3{
    font-size:15px;display:flex;align-items:center;gap:9px;margin-bottom:16px;
    padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .panel h3 .num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--white);
    background:var(--teal);border-radius:5px;padding:2px 7px;
  }

  label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:var(--ink-2);}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;
    background:var(--paper);font-size:13.5px;color:var(--ink);outline:none;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--teal);box-shadow:0 0 0 3px rgba(62,124,130,.15);
  }
  textarea{resize:vertical;min-height:64px;}
  .hint{font-size:11.5px;color:var(--slate);margin-top:5px;}
  .err{font-size:11.5px;color:var(--rose-dark);margin-top:5px;display:none;}
  .ok-msg{font-size:11.5px;color:var(--green-dark);margin-top:5px;}
  .radio-row{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;margin:0;color:var(--ink);}
  .radio-row input{width:auto;}

  .btn{border:none;border-radius:7px;padding:11px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .12s ease, border-color .12s ease, color .12s ease;}
  .btn-primary{background:var(--ink);color:var(--paper);width:100%;justify-content:center;margin-top:16px;}
  .btn-primary:hover{background:var(--ink-2);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{background:var(--amber-dark);color:var(--white);}
  .btn-teal{background:var(--teal);color:var(--white);}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .btn-danger{background:var(--rose);color:var(--white);}
  .btn-danger:hover{background:var(--rose-dark);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-warning{background:var(--amber);color:var(--ink);}
  .btn-warning:hover{background:var(--amber-dark);color:var(--white);}

  .emp-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;
  }
  .emp-item:last-child{border-bottom:none;}
  .emp-item .who b{display:block;font-size:13.5px;}
  .emp-item .who span{color:var(--slate);font-size:12px;}
  .del-btn{background:none;border:none;color:var(--rose-dark);font-size:11.5px;text-decoration:underline;padding:0;white-space:nowrap;}
  .empty{color:var(--slate);font-size:13px;text-align:center;padding:18px 0;}

  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;
    padding:3px 8px;border-radius:999px;white-space:nowrap;
  }
  .badge-approved{background:#E4EFE8;color:var(--green-dark);}
  .badge-pending{background:#FBEFDC;color:var(--amber-dark);}
  .badge-suspended{background:#FDE8E8;color:var(--rose-dark);}

  .company-card{
    border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    transition:border-color .12s ease;
  }
  .company-card:hover{border-color:var(--teal);}
  .company-card .info b{display:block;font-size:14px;}
  .company-card .info span{font-size:12px;color:var(--slate);}

  .tab-row{display:flex;gap:8px;margin-bottom:18px;}
  .tab-row .btn{flex:1;margin-top:0;}

  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .cal-head h3{font-size:18px;border:none;padding:0;margin:0;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;width:30px;height:30px;font-size:14px;color:var(--ink);}
  .cal-nav button:hover{background:var(--line);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);
    text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1/0.85;border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px;
    background:var(--paper);cursor:pointer;display:flex;flex-direction:column;position:relative;
    transition:border-color .15s ease, background .15s ease;
  }
  .cal-day.muted{opacity:.35;pointer-events:none;}
  .cal-day:hover{border-color:var(--teal);}
  .cal-day.selected{border-color:var(--ink);background:var(--paper-2);}
  .cal-day.today .num{color:var(--teal-dark);}
  .cal-day .num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .dot-all{background:var(--amber);}
  .dot-one{background:var(--rose);}
  .dot-personal{background:var(--teal);}

  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--slate);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .cal-dot{width:7px;height:7px;}

  .agenda-title{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;
    color:var(--slate);text-transform:uppercase;margin:22px 0 10px;
  }
  .event-card{
    border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;
    padding:12px 14px;margin-bottom:10px;background:var(--paper);
  }
  .event-card.individual{border-left-color:var(--rose);}
  .event-card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .event-card h4{font-size:14px;margin-bottom:3px;}
  .event-card .time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--teal-dark);white-space:nowrap;}
  .event-card p{font-size:13px;color:var(--slate);margin:6px 0 0;line-height:1.5;}
  .event-card .target{
    display:inline-block;margin-top:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);
  }
  .event-card .rm{background:none;border:none;color:var(--rose-dark);font-size:11px;text-decoration:underline;margin-top:8px;}

  .login-box{max-width:460px;margin:60px auto;}
  .login-box.wide{max-width:520px;}

  .company-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .company-tabs button{
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:12.5px;color:var(--ink);
  }
  .company-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .select-header{display:flex;justify-content:space-between;align-items:center;margin:16px 0 7px;}
  .select-header label{margin:0;}
  .sel-count{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--teal-dark);
    background:#EAF2F2;padding:3px 9px;border-radius:999px;white-space:nowrap;
  }
  .check-toolbar{display:flex;gap:14px;margin-bottom:8px;}
  .check-toolbar button{
    background:none;border:none;padding:0;font-size:11.5px;color:var(--teal-dark);
    text-decoration:underline;
  }
  .checkbox-list{
    max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;
    padding:6px;background:var(--paper);display:flex;flex-direction:column;gap:3px;
  }
  .check-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
    cursor:pointer;transition:background .12s ease;
  }
  .check-item:hover{background:var(--paper-2);}
  .check-item input{width:auto;margin:0;accent-color:var(--teal);flex-shrink:0;}
  .check-item-info{display:flex;flex-direction:column;font-size:12.5px;}
  .check-item-info b{font-size:13px;font-weight:600;}
  .check-item-info span{color:var(--slate);font-size:11.5px;}

  .panel-note{font-size:12px;color:var(--slate);line-height:1.5;margin-top:4px;}
  .section-divider{border:none;border-top:1px solid var(--line);margin:20px 0 14px;}

  .personal-cal-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
  .personal-cal-left{flex:1 1 320px;min-width:260px;}
  .personal-cal-right{flex:1 1 220px;min-width:210px;}
  .personal-cal-right .agenda-title{margin-top:0;}

  .compact-event-row{padding:11px 0;border-bottom:1px solid var(--line);}
  .compact-event-row:last-child{border-bottom:none;}
  .compact-event-row .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .compact-event-row h5{font-size:13.5px;margin:0;font-family:'Space Grotesk',sans-serif;}
  .compact-event-row .time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-dark);white-space:nowrap;}
  .compact-event-row p{font-size:12.5px;color:var(--slate);margin:4px 0 0;line-height:1.45;}
  .compact-event-row .rm{background:none;border:none;color:var(--rose-dark);font-size:11px;text-decoration:underline;padding:0;margin-top:6px;display:inline-block;}

  /* Stats cards */
  .stats-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;
  }
  .stat-card{
    background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px;text-align:center;
  }
  .stat-card .num{font-size:28px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--teal-dark);}
  .stat-card .label{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;}

  ::selection{background:var(--amber);color:var(--ink);}
  /* Toast notification */
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
    padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);
    z-index:2000;animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>
<body>

<div class="ticker"></div>
<div class="topbar">
  <div class="brand">
    <span class="idx">CR—01</span>
    <div>
      <h1>Cronograma</h1>
      <p>Painel de marcações da equipe</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="save-indicator" id="saveIndicator">⏺ <span class="saved" id="saveStatus">salvo</span></span>
    <button class="settings-btn" id="settingsBtn">⚙️ Configurações</button>
    <div id="roleIndicator"></div>
  </div>
</div>

<div id="app" class="wrap"></div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <button class="close" id="closeSettings">✕</button>
    <h2>⚙️ Configurações</h2>
    
    <label>Alterar senha</label>
    <input type="password" id="newPassword" placeholder="Nova senha (mín. 6 caracteres)">
    <input type="password" id="confirmNewPassword" placeholder="Confirmar nova senha" style="margin-top:6px;">
    <button class="btn btn-primary" id="changePasswordBtn" style="margin-top:8px;">Alterar senha</button>
    <div id="passwordMsg" style="margin-top:6px;font-size:12px;"></div>

    <hr class="section-divider">

    <label>Tema</label>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-sm btn-ghost" id="themeLight">☀️ Claro</button>
      <button class="btn btn-sm btn-ghost" id="themeDark">🌙 Escuro</button>
    </div>

    <hr class="section-divider">

    <label>Localidade</label>
    <select id="settingsCity">
      <option value="">Selecione sua cidade</option>
      <option value="Florianópolis">Florianópolis</option>
      <option value="Joinville">Joinville</option>
      <option value="Blumenau">Blumenau</option>
      <option value="Itajaí">Itajaí</option>
      <option value="São José">São José</option>
      <option value="Palhoça">Palhoça</option>
      <option value="Criciúma">Criciúma</option>
      <option value="Chapecó">Chapecó</option>
      <option value="Jaraguá do Sul">Jaraguá do Sul</option>
      <option value="Lages">Lages</option>
      <option value="Balneário Camboriú">Balneário Camboriú</option>
      <option value="Tubarão">Tubarão</option>
    </select>
  </div>
</div>

<!-- Global Admin Dashboard (dev access) -->
<div id="globalAdminModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:600px;">
    <button class="close" id="closeGlobalAdmin">✕</button>
    <h2>📊 Painel Global — Desenvolvedor</h2>
    
    <div class="stats-grid" id="globalStats">
      <div class="stat-card"><div class="num" id="statCompanies">0</div><div class="label">Empresas</div></div>
      <div class="stat-card"><div class="num" id="statUsers">0</div><div class="label">Usuários</div></div>
      <div class="stat-card"><div class="num" id="statVisits">0</div><div class="label">Visitas</div></div>
    </div>

    <h4 style="margin-top:16px;">Empresas cadastradas</h4>
    <div id="globalCompanyList"></div>

    <div style="margin-top:16px;">
      <label>Selecionar empresa para ação</label>
      <select id="globalCompanySelect" style="margin-bottom:8px;"></select>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm btn-danger" id="globalRemoveCompany">🗑️ Remover empresa</button>
        <button class="btn btn-sm btn-warning" id="globalWarnCompany">⚠️ Alertar empresa</button>
        <button class="btn btn-sm btn-teal" id="globalSuspendCompany">🔒 Suspender acesso</button>
      </div>
      <div id="globalActionMsg" style="margin-top:8px;font-size:12px;"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   PERSISTÊNCIA DE DADOS (localStorage)
   ========================================================= */
const STORAGE_KEY = 'cronograma_app_data';
let saveTimeout = null;

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      // Restaurar datas como objetos Date
      if(parsed.calDate) state.calDate = new Date(parsed.calDate);
      if(parsed.personalCalDate) state.personalCalDate = new Date(parsed.personalCalDate);
      // Restaurar tema
      if(parsed.theme) document.documentElement.setAttribute('data-theme', parsed.theme);
      return true;
    }
  }catch(e){ console.warn('Erro ao carregar dados:', e); }
  return false;
}

function saveState(){
  const data = {
    ...state,
    calDate: state.calDate.toISOString(),
    personalCalDate: state.personalCalDate.toISOString(),
    theme: document.documentElement.getAttribute('data-theme') || 'light'
  };
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    updateSaveIndicator('saved');
  }catch(e){ console.warn('Erro ao salvar:', e); }
}

function scheduleSave(){
  const status = document.getElementById('saveStatus');
  if(status) status.textContent = 'salvando...';
  updateSaveIndicator('saving');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    saveState();
  }, 300);
}

function updateSaveIndicator(st){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(st === 'saved'){
    el.textContent = '✓ salvo';
    el.className = 'saved';
  }else{
    el.textContent = '⏳ salvando...';
    el.className = 'saving';
  }
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function maskCPF(value){
  let v = value.replace(/\D/g,"").slice(0,11);
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  return v;
}

// Validação simplificada de CPF: exige 11 dígitos e recusa sequências
// óbvias tipo "111.111.111-11". Não confere mais os dígitos verificadores
// (que exigem um CPF matematicamente "real"), para não travar cadastros
// de teste ou dados internos que não sejam CPFs oficiais.
function isPlausibleCPF(raw){
  const cpf = raw.replace(/\D/g,"");
  if(cpf.length !== 11) return false;
  if(/^(\d)\1{10}$/.test(cpf)) return false;
  return true;
}

function isValidGmail(email){
  return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email.trim());
}

function fmtDateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDatePretty(key){
  const [y,m,d] = key.split("-");
  return `${d}/${m}/${y}`;
}
const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW_PT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function eventsForDay(list, key){
  return list.filter(e => e.data === key).sort((a,b)=> a.hora.localeCompare(b.hora));
}

function currentAdmin(){
  return state.admins.find(a => a.id === state.session?.adminId) || null;
}
function currentEmployee(){
  return state.employees.find(e => e.id === state.session?.employeeId) || null;
}
function membershipOf(employeeId, companyId){
  return state.memberships.find(m => m.employeeId===employeeId && m.companyId===companyId) || null;
}
function approvedEmployeesOf(companyId){
  return state.memberships
    .filter(m => m.companyId===companyId && m.status==="approved")
    .map(m => state.employees.find(e=>e.id===m.employeeId))
    .filter(Boolean);
}
function pendingIncomingRequestsOf(companyId){
  return state.memberships.filter(m => m.companyId===companyId && m.status==="pending" && m.origin==="employee");
}
function pendingInvitesSentOf(companyId){
  return state.memberships.filter(m => m.companyId===companyId && m.status==="pending" && m.origin==="admin");
}
function personalEventsOf(ownerType, ownerId){
  return state.personalEvents.filter(e => e.ownerType===ownerType && e.ownerId===ownerId);
}
function approvedCompaniesOf(employeeId){
  return state.memberships
    .filter(m => m.employeeId===employeeId && m.status==="approved")
    .map(m => state.admins.find(a=>a.id===m.companyId))
    .filter(Boolean);
}
function eventsVisibleToEmployeeInCompany(employeeId, companyId){
  return state.events.filter(e =>
    e.companyId===companyId &&
    (e.tipo==="todos" || (e.tipo==="especificos" && e.destinatarios.includes(employeeId)))
  );
}
function isCompanySuspended(companyId){
  return state.suspendedCompanies.includes(companyId);
}
function isCompanyWarned(companyId){
  return state.warnedCompanies.includes(companyId);
}

function showToast(msg, duration = 3000){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;

}

function render(){
  const app = document.getElementById("app");
  const roleBox = document.getElementById("roleIndicator");

  // Verificar se há um dev admin logado (acesso global)
  const devAdmin = state.session?.type === 'devadmin';
  if(devAdmin){
    roleBox.innerHTML = rolePillHTML("🔧 Dev Admin");
    app.innerHTML = renderGlobalAdminDashboard();
    bindGlobalAdminEvents();
    return;
  }

  if(!state.role){
    roleBox.innerHTML = "";
    app.innerHTML = renderGate();
    return;
  }

  if(state.role === "admin" && !state.session){
    roleBox.innerHTML = rolePillHTML("Administrador");
    app.innerHTML = renderAdminAuthGate();
    bindAdminAuthEvents();
    return;
  }
  if(state.role === "admin" && state.session){
    const adm = currentAdmin();
    if(!adm){ state.session = null; render(); return; }
    roleBox.innerHTML = rolePillHTML(adm.nomeEmpresa);
    app.innerHTML = renderAdminDashboard(adm);
    bindAdminDashboardEvents(adm);
    return;
  }

  if(state.role === "funcionario" && !state.session){
    roleBox.innerHTML = rolePillHTML("Funcionário");
    app.innerHTML = renderEmployeeAuthGate();
    bindEmployeeAuthEvents();
    return;
  }
  if(state.role === "funcionario" && state.session){
    const emp = currentEmployee();
    if(!emp){ state.session = null; render(); return; }
    roleBox.innerHTML = rolePillHTML("Funcionário — " + emp.nome.split(" ")[0]);
    app.innerHTML = renderEmployeeDashboard(emp);
    bindEmployeeDashboardEvents(emp);
    return;
  }
}

function bindGlobalAdminEvents(){
  // Remover empresa
  document.querySelectorAll('[data-global-remove]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-global-remove');
      if(confirm(`Tem certeza que deseja remover esta empresa e todos os dados associados?`)){
        // Remover empresa e todos os dados associados
        state.admins = state.admins.filter(a => a.id !== id);
        state.memberships = state.memberships.filter(m => m.companyId !== id);
        state.events = state.events.filter(e => e.companyId !== id);
        state.suspendedCompanies = state.suspendedCompanies.filter(c => c !== id);
        state.warnedCompanies = state.warnedCompanies.filter(c => c !== id);
        scheduleSave();
        render();
        showToast('🗑️ Empresa removida com sucesso!');
      }
    });
  });

  // Alertar empresa
  document.querySelectorAll('[data-global-warn]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-global-warn');
      if(!state.warnedCompanies.includes(id)){
        state.warnedCompanies.push(id);
      }else{
        state.warnedCompanies = state.warnedCompanies.filter(c => c !== id);
      }
      scheduleSave();
      render();
      showToast(state.warnedCompanies.includes(id) ? '⚠️ Empresa alertada!' : '✅ Alerta removido!');
    });
  });

  // Suspender/Reativar empresa
  document.querySelectorAll('[data-global-suspend]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-global-suspend');
      if(state.suspendedCompanies.includes(id)){
        state.suspendedCompanies = state.suspendedCompanies.filter(c => c !== id);
        showToast('✅ Empresa reativada!');
      }else{
        state.suspendedCompanies.push(id);
        showToast('🔒 Empresa suspensa!');
      }
      scheduleSave();
      render();
    });
  });

  document.getElementById('exitDevMode').addEventListener('click', ()=>{
    state.session = null;
    state.role = null;
    render();
    showToast('Saindo do modo desenvolvedor.');
  });
}

function bindAdminAuthEvents(){
  document.querySelectorAll("[data-adm-tab]").forEach(btn=>{

  });

        render();
        showToast(`Bem-vindo(a), ${adm.nomeAdmin}!`);
      } else {
        errBox.style.display = "block";

    });

  if(regBtn){
    regBtn.addEventListener("click", ()=>{

      const nomeEmpresa = document.getElementById("admRegEmpresa").value.trim();
      const senha = document.getElementById("admRegSenha").value;
      const senha2 = document.getElementById("admRegSenha2").value;
      const errBox = document.getElementById("admRegErr");

      let msg = "";
      if(!isValidGmail(email)) msg = "Informe um e-mail Gmail válido (ex: voce@gmail.com).";
      else if(state.admins.some(a=>a.email.toLowerCase()===email.toLowerCase())) msg = "Já existe uma conta com esse e-mail. Use a aba \"Entrar\".";
      else if(!nomeAdmin) msg = "Informe o nome do administrador.";
      else if(!nomeEmpresa) msg = "Informe o nome da empresa.";
      else if(senha.length < 6) msg = "A senha precisa ter pelo menos 6 caracteres.";
      else if(senha !== senha2) msg = "As senhas não são iguais.";

      if(msg){
        errBox.textContent = msg;
        errBox.style.display = "block";
        return;
      }
      errBox.style.display = "none";
      const novoAdmin = { id: uid(), email, nomeAdmin, nomeEmpresa, senha, cidade: '' };
      state.admins.push(novoAdmin);
      state.session = { type:"admin", adminId: novoAdmin.id };
      scheduleSave();
      render();
      showToast(`🎉 Empresa "${nomeEmpresa}" criada com sucesso!`);
    });

function renderInviteResults(adm){
  const term = state.employeeInviteSearch.trim().toLowerCase();
  if(term.length < 2){
    return '<p class="hint">Digite ao menos 2 letras do nome ou parte do CPF para buscar.</p>';
  }
  const cpfDigits = term.replace(/\D/g,"");
  const results = state.employees.filter(emp=>{
    const already = state.memberships.some(m=>m.employeeId===emp.id && m.companyId===adm.id);
    if(already) return false;
    const nameMatch = emp.nome.toLowerCase().includes(term);
    const cpfMatch = cpfDigits.length>=3 && emp.cpf.replace(/\D/g,"").includes(cpfDigits);
    return nameMatch || cpfMatch;
  }).slice(0,8);

  if(results.length===0) return '<div class="empty">Nenhum funcionário encontrado (ou já vinculado ao grupo).</div>';

  return results.map(emp=>`
    <div class="emp-item">
      <div class="who">
        <b>${emp.nome}</b>
        <span>${emp.cidade} · <span class="mono">${emp.cpf}</span></span>
      </div>
      <button class="btn btn-teal btn-sm" data-invite="${emp.id}">Convidar</button>
    </div>
  `).join("");
}

function updateSelCount(){
  const countEl = document.getElementById("selCount");
  if(!countEl) return;
  const n = document.querySelectorAll(".ev-emp-check:checked").length;
  countEl.textContent = `${n} selecionado(s)`;
}

function bindAdminDashboardEvents(adm){
  document.getElementById("pendingList").addEventListener("click",(e)=>{
    const apBtn = e.target.closest("[data-approve]");
    const rjBtn = e.target.closest("[data-reject]");
    if(apBtn){
      const m = state.memberships.find(x=>x.id===apBtn.getAttribute("data-approve"));
      if(m) m.status = "approved";
      scheduleSave();
      render();
      showToast('✅ Funcionário aprovado!');
    }
    if(rjBtn){
      const id = rjBtn.getAttribute("data-reject");
      state.memberships = state.memberships.filter(x=>x.id!==id);
      scheduleSave();
      render();
      showToast('❌ Solicitação recusada.');
    }
  });

  document.getElementById("approvedList").addEventListener("click",(e)=>{
    const btn = e.target.closest("[data-revoke]");
    if(!btn) return;
    const empId = btn.getAttribute("data-revoke");
    state.memberships = state.memberships.filter(m => !(m.employeeId===empId && m.companyId===adm.id));
    state.events = state.events.reduce((acc, ev)=>{
      if(ev.companyId===adm.id && ev.tipo==="especificos" && ev.destinatarios.includes(empId)){
        const restantes = ev.destinatarios.filter(id=>id!==empId);
        if(restantes.length===0) return acc;
        acc.push({ ...ev, destinatarios: restantes });
        return acc;
      }
      acc.push(ev);
      return acc;
    }, []);
    scheduleSave();
    render();
    showToast('👤 Funcionário removido da equipe.');
  });

  const inviteSearchInput = document.getElementById("inviteSearchInput");
  if(inviteSearchInput){
    inviteSearchInput.addEventListener("input", ()=>{
      state.employeeInviteSearch = inviteSearchInput.value;
      render();
      const el = document.getElementById("inviteSearchInput");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  const inviteResults = document.getElementById("inviteResults");
  if(inviteResults){
    inviteResults.addEventListener("click",(e)=>{
      const btn = e.target.closest("[data-invite]");
      if(!btn) return;
      const employeeId = btn.getAttribute("data-invite");
      state.memberships.push({ id: uid(), employeeId, companyId: adm.id, status: "pending", origin: "admin" });
      scheduleSave();
      render();
      showToast('📨 Convite enviado!');
    });
  }
  const sentInvitesList = document.getElementById("sentInvitesList");
  if(sentInvitesList){
    sentInvitesList.addEventListener("click",(e)=>{
      const btn = e.target.closest("[data-cancel-invite]");
      if(!btn) return;
      const id = btn.getAttribute("data-cancel-invite");
      state.memberships = state.memberships.filter(m=>m.id!==id);
      scheduleSave();
      render();
      showToast('✖️ Convite cancelado.');
    });
  }

  document.querySelectorAll('input[name="destino"]').forEach(r=>{
    r.addEventListener("change", (e)=>{
      document.getElementById("individualBlock").style.display =
        e.target.value === "especificos" ? "block" : "none";
    });
  });

  const checklist = document.getElementById("evEmpChecklist");
  if(checklist){
    checklist.addEventListener("change", updateSelCount);
  }
  const selAllBtn = document.getElementById("selAllEmp");
  if(selAllBtn){
    selAllBtn.addEventListener("click", ()=>{
      document.querySelectorAll(".ev-emp-check").forEach(cb=>cb.checked=true);
      updateSelCount();
    });
  }
  const selNoneBtn = document.getElementById("selNoneEmp");
  if(selNoneBtn){
    selNoneBtn.addEventListener("click", ()=>{
      document.querySelectorAll(".ev-emp-check").forEach(cb=>cb.checked=false);
      updateSelCount();
    });
  }

  document.getElementById("addEventBtn").addEventListener("click", ()=>{
    const titulo = document.getElementById("evTitulo").value.trim();
    const data = document.getElementById("evData").value;
    const hora = document.getElementById("evHora").value;
    const desc = document.getElementById("evDesc").value.trim();
    const destinoTipo = document.querySelector('input[name="destino"]:checked').value;
    const empIds = Array.from(document.querySelectorAll(".ev-emp-check:checked")).map(el=>el.value);
    const errBox = document.getElementById("evErr");

    const destinoValido = destinoTipo === "todos" || (destinoTipo === "especificos" && empIds.length>0);
    if(!titulo || !data || !hora || !destinoValido){
      errBox.style.display = "block";
      return;
    }
    errBox.style.display = "none";
    state.events.push({
      id: uid(), companyId: adm.id, titulo, data, hora, descricao: desc,
      tipo: destinoTipo,
      destinatarios: destinoTipo === "todos" ? [] : empIds
    });
    state.selectedDay = data;
    scheduleSave();
    render();
    showToast('📅 Evento criado com sucesso!');
  });

  // Botão "Hoje" no calendário
  const todayBtn = document.getElementById('calTodayBtn');
  if(todayBtn){
    todayBtn.addEventListener('click', ()=>{
      state.calDate = new Date();
      state.selectedDay = fmtDateKey(new Date());
      render();
    });
  }

  bindCalendarNav();
  bindEventRemoval();
  bindPersonalAgendaEvents("admin", adm.id);
}

function renderEmployeeRegisterForm(){

      ${SC_CITIES.map(c=>`<option value="${c}">${c}</option>`).join("")}
    </select>
    <div class="err" id="regErr">Confira os dados: nome, cidade e CPF (11 dígitos, sem repetição).</div>

  `;

function bindEmployeeAuthEvents(){
  document.querySelectorAll("[data-emp-auth-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.employeeAuthTab = btn.getAttribute("data-emp-auth-tab"); render(); });
  });

  const loginCpf = document.getElementById("empLoginCPF");
  if(loginCpf){
    loginCpf.addEventListener("input", ()=>{ loginCpf.value = maskCPF(loginCpf.value); });
    document.getElementById("empLoginBtn").addEventListener("click", ()=>{
      const cpf = loginCpf.value;
      const errBox = document.getElementById("empLoginErr");
      const emp = state.employees.find(e => e.cpf === cpf);
      if(emp){
        state.session = { type:"funcionario", employeeId: emp.id };
        state.selectedDay = null;
        state.employeeActiveCompanyId = null;
        scheduleSave();
        render();
        showToast(`👋 Bem-vindo(a), ${emp.nome}!`);
      } else {
        errBox.style.display = "block";
      }
    });
  }

  const regCpf = document.getElementById("regCPF");
  if(regCpf){
    regCpf.addEventListener("input", ()=>{ regCpf.value = maskCPF(regCpf.value); });
    document.getElementById("registerBtn").addEventListener("click", ()=>{
      const nome = document.getElementById("regNome").value.trim();
      const cpf = regCpf.value.trim();
      const cidade = document.getElementById("regCidade").value;
      const errBox = document.getElementById("regErr");
      const cpfDigits = cpf.replace(/\D/g,"");

      let msg = "";
      if(!nome) msg = "Informe seu nome completo.";
      else if(!cidade) msg = "Selecione sua cidade.";
      else if(cpfDigits.length !== 11) msg = "O CPF precisa ter 11 dígitos.";
      else if(!isPlausibleCPF(cpf)) msg = "Esse CPF não é válido.";
      else if(state.employees.some(e=>e.cpf===cpf)) msg = "Esse CPF já está cadastrado. Use a aba \"Já sou cadastrado\".";

      if(msg){
        errBox.textContent = msg;
        errBox.style.display = "block";
        return;
      }
      errBox.style.display = "none";
      const novoFuncionario = { id: uid(), nome, cpf, cidade };
      state.employees.push(novoFuncionario);
      state.session = { type:"funcionario", employeeId: novoFuncionario.id };
      state.selectedDay = null;
      scheduleSave();
      render();
      showToast(`✅ Cadastro realizado com sucesso, ${nome}!`);
    });
  }
}

function renderEmployeeDashboard(emp){
  const myMemberships = state.memberships.filter(m=>m.employeeId===emp.id);
  const approvedCompanies = approvedCompaniesOf(emp.id);

  if(!state.employeeActiveCompanyId && approvedCompanies.length>0){
    state.employeeActiveCompanyId = approvedCompanies[0].id;
  }

  const searchTerm = state.companySearch.trim().toLowerCase();
  const filteredCompanies = state.admins.filter(a =>
    !searchTerm || a.nomeEmpresa.toLowerCase().includes(searchTerm)
  );

  const activeCompany = state.admins.find(a=>a.id===state.employeeActiveCompanyId);
  const calendarEvents = activeCompany
    ? eventsVisibleToEmployeeInCompany(emp.id, activeCompany.id)
    : [];

  return `
  <div class="dashboard-wrap">
  <div class="layout" style="grid-template-columns:350px 1fr;">
    <div>
      <div class="panel">
        <h3><span class="num">01</span>Minhas empresas</h3>
        <div id="myMembershipsList">
        ${myMemberships.length===0 ? '<div class="empty">Você ainda não solicitou entrada em nenhuma empresa.</div>' :
          myMemberships.map(m=>{
            const company = state.admins.find(a=>a.id===m.companyId);
            if(!company) return "";
            let rightHtml;
            if(m.status==="approved"){
              rightHtml = `<span class="badge badge-approved">Aprovado</span>`;
            } else if(m.origin==="admin"){
              rightHtml = `
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                  <span class="badge badge-pending">Convite recebido</span>
                  <button class="btn btn-teal btn-sm" data-accept-invite="${m.id}">Aceitar</button>
                  <button class="del-btn" data-decline-invite="${m.id}">recusar</button>
                </div>`;
            } else {
              rightHtml = `<span class="badge badge-pending">Aguardando aprovação</span>`;
            }
            return `
              <div class="company-card">
                <div class="info">
                  <b>${company.nomeEmpresa}</b>
                  <span>Responsável: ${company.nomeAdmin}</span>
                </div>
                ${rightHtml}
              </div>`;
          }).join("")
        }
        </div>
      </div>

      <div class="panel">
        <h3><span class="num">02</span>Buscar empresa</h3>
        <input type="text" id="companySearchInput" placeholder="Digite o nome da empresa..." value="${state.companySearch}">
        <div style="margin-top:14px;" id="companyResults">
          ${filteredCompanies.length===0 ? '<div class="empty">Nenhuma empresa encontrada.</div>' :
            filteredCompanies.map(c=>{
              const m = membershipOf(emp.id, c.id);
              let btnHtml;
              if(isCompanySuspended(c.id)){
                btnHtml = `<button class="btn btn-ghost btn-sm" disabled>🔒 Suspensa</button>`;
              } else if(!m) btnHtml = `<button class="btn btn-amber btn-sm" data-request="${c.id}">Solicitar entrada</button>`;
              else if(m.status==="pending" && m.origin==="employee") btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Solicitação enviada</button>`;
              else if(m.status==="pending" && m.origin==="admin") btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Convite recebido — veja acima</button>`;
              else btnHtml = `<button class="btn btn-ghost btn-sm" disabled>Você já faz parte</button>`;
              return `
                <div class="company-card">
                  <div class="info">
                    <b>${c.nomeEmpresa}</b>
                    <span>Responsável: ${c.nomeAdmin}</span>
                  </div>
                  ${btnHtml}
                </div>`;
            }).join("")
          }
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3><span class="num">03</span>Agenda da empresa</h3>
        ${approvedCompanies.length===0 ? `
          <p class="hint">Assim que uma empresa aprovar sua solicitação, o cronograma dela aparece aqui.</p>
        ` : `
          <div class="company-tabs">
            ${approvedCompanies.map(c=>`
              <button data-cal-company="${c.id}" class="${c.id===state.employeeActiveCompanyId?'active':''}">${c.nomeEmpresa}</button>
            `).join("")}
          </div>
          ${renderCalendarBlock(calendarEvents, activeCompany ? activeCompany.nomeEmpresa : "")}
        `}
      </div>
    </div>
  </div>

  <div class="full-panel">
    ${renderPersonalAgendaPanel("04", "funcionario", emp.id)}
  </div>
  </div>`;
}

  </div>`;
}

function bindPersonalAgendaEvents(ownerType, ownerId){
  const btn = document.getElementById("addPersonalEventBtn");
  if(btn){
    btn.addEventListener("click", ()=>{
      const titulo = document.getElementById("peTitulo").value.trim();
      const data = document.getElementById("peData").value;
      const hora = document.getElementById("peHora").value;
      const desc = document.getElementById("peDesc").value.trim();
      const errBox = document.getElementById("peErr");
      if(!titulo || !data || !hora){
        errBox.style.display = "block";
        return;
      }
      errBox.style.display = "none";
      state.personalEvents.push({ id: uid(), ownerType, ownerId, titulo, data, hora, descricao: desc });
      state.personalSelectedDay = data;
      scheduleSave();
      render();
      showToast('📝 Compromisso adicionado!');
    });
  }

  // Botão "Hoje" no calendário pessoal
  const todayBtn = document.getElementById('personalTodayBtn');
  if(todayBtn){
    todayBtn.addEventListener('click', ()=>{
      state.personalCalDate = new Date();
      state.personalSelectedDay = fmtDateKey(new Date());
      render();
    });
  }

  bindPersonalCalendarNav();
  bindPersonalEventRemoval();
}

function renderPersonalCalendarBlock(eventList, title){
  const year = state.personalCalDate.getFullYear();
  const month = state.personalCalDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = fmtDateKey(new Date());

  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const key = fmtDateKey(dateObj);
    const dayEvents = eventsForDay(eventList, key);
    const has = dayEvents.length>0;
    const classes = ["cal-day"];
    if(key===todayKey) classes.push("today");
    if(key===state.personalSelectedDay) classes.push("selected");
    cells += `
      <div class="${classes.join(' ')}" data-personal-day="${key}">
        <span class="num">${String(d).padStart(2,"0")}</span>
        <div class="cal-dots">
          ${has?'<span class="cal-dot dot-personal"></span>':''}
        </div>
      </div>`;
  }

  const selKey = state.personalSelectedDay;
  const selEvents = selKey ? eventsForDay(eventList, selKey) : [];

  let rightContent;
  if(!selKey){
    rightContent = '<div class="empty">Clique em um dia no calendário para ver os compromissos.</div>';
  } else if(selEvents.length===0){
    rightContent = '<div class="empty">Nenhum compromisso nesta data.</div>';
  } else {
    rightContent = `<div class="event-card personal">${selEvents.map(renderCompactPersonalRow).join("")}</div>`;
  }

  return `
    <div class="cal-head">
      <h3>${title} — ${MONTHS_PT[month]} ${year}</h3>
      <div class="cal-nav">
        <button data-personal-cal-nav="-1">‹</button>
        <button id="personalTodayBtn" style="font-size:10px;width:auto;padding:0 8px;">Hoje</button>
        <button data-personal-cal-nav="1">›</button>
      </div>
    </div>
    <div class="personal-cal-wrap">
      <div class="personal-cal-left">
        <div class="cal-grid">
          ${DOW_PT.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
          ${cells}
        </div>
        <div class="legend">
          <span><span class="cal-dot dot-personal"></span> Compromisso pessoal</span>
        </div>
      </div>
      <div class="personal-cal-right">
        <div class="agenda-title">${selKey ? "Compromissos em " + fmtDatePretty(selKey) : "Selecione um dia"}</div>
        <div id="personalDayAgenda">${rightContent}</div>
      </div>
    </div>
  `;
}

function renderCompactPersonalRow(ev){
  return `
    <div class="compact-event-row">
      <div class="row-top">
        <h5>${ev.titulo}</h5>
        <span class="time mono">${ev.hora}</span>
      </div>
      ${ev.descricao ? `<p>${ev.descricao}</p>` : ""}
      <button class="rm" data-remove-personal-event="${ev.id}">remover compromisso</button>
    </div>
  `;
}

function bindPersonalCalendarNav(){
  document.querySelectorAll("[data-personal-cal-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const delta = parseInt(btn.getAttribute("data-personal-cal-nav"));
      state.personalCalDate.setMonth(state.personalCalDate.getMonth() + delta);
      render();
    });
  });
  document.querySelectorAll("[data-personal-day]").forEach(cell=>{
    cell.addEventListener("click", ()=>{
      const key = cell.getAttribute("data-personal-day");
      state.personalSelectedDay = state.personalSelectedDay === key ? null : key;
      render();
    });
  });
}

function bindPersonalEventRemoval(){
  const agenda = document.getElementById("personalDayAgenda");
  if(!agenda) return;
  agenda.addEventListener("click",(e)=>{
    const btn = e.target.closest("[data-remove-personal-event]");
    if(!btn) return;
    const id = btn.getAttribute("data-remove-personal-event");
    state.personalEvents = state.personalEvents.filter(ev=>ev.id!==id);
    scheduleSave();
    render();
    showToast('🗑️ Compromisso removido.');
  });
}

/* =========================================================
   CALENDÁRIO (compartilhado)
   ========================================================= */
function renderCalendarBlock(eventList, title){
  const year = state.calDate.getFullYear();
  const month = state.calDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = fmtDateKey(new Date());

  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const key = fmtDateKey(dateObj);
    const dayEvents = eventsForDay(eventList, key);
    const hasAll = dayEvents.some(e=>e.tipo==="todos");
    const hasOne = dayEvents.some(e=>e.tipo==="especificos");
    const classes = ["cal-day"];
    if(key===todayKey) classes.push("today");
    if(key===state.selectedDay) classes.push("selected");
    cells += `
      <div class="${classes.join(' ')}" data-day="${key}">
        <span class="num">${String(d).padStart(2,"0")}</span>
        <div class="cal-dots">
          ${hasAll?'<span class="cal-dot dot-all"></span>':''}
          ${hasOne?'<span class="cal-dot dot-one"></span>':''}
        </div>
      </div>`;
  }

  const selKey = state.selectedDay;
  const selEvents = selKey ? eventsForDay(eventList, selKey) : [];

  return `
    <div class="cal-head">
      <h3>${title} — ${MONTHS_PT[month]} ${year}</h3>
      <div class="cal-nav">
        <button data-cal-nav="-1">‹</button>
        <button id="calTodayBtn" style="font-size:10px;width:auto;padding:0 8px;">Hoje</button>
        <button data-cal-nav="1">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW_PT.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="legend">
      <span><span class="cal-dot dot-all"></span> Evento para todo o grupo</span>
      <span><span class="cal-dot dot-one"></span> Evento para funcionário(s) específico(s)</span>
    </div>

    <div class="agenda-title">${selKey ? "Eventos em " + fmtDatePretty(selKey) : "Selecione um dia para ver os detalhes"}</div>
    <div id="dayAgenda">
      ${selKey && selEvents.length===0 ? '<div class="empty">Nenhum evento nesta data.</div>' : ""}
      ${selEvents.map(ev => renderEventCard(ev)).join("")}
    </div>
  `;
}

function renderEventCard(ev){
  const isEspecifico = ev.tipo !== "todos";
  let targetLabel = "Todo o grupo";
  let tagLabel = "Grupo inteiro";
  if(isEspecifico){
    const nomes = ev.destinatarios.map(id => state.employees.find(e=>e.id===id)?.nome || "Funcionário removido");
    targetLabel = nomes.length <= 2 ? nomes.join(" e ") : `${nomes[0]} + ${nomes.length-1} outro(s)`;
    tagLabel = (nomes.length > 1 ? "Vários funcionários · " : "Específico · ") + targetLabel;
  }
  const showRemove = state.role === "admin";
  return `
    <div class="event-card ${isEspecifico?'individual':''}">
      <div class="row">
        <h4>${ev.titulo}</h4>
        <span class="time mono">${ev.hora}</span>
      </div>
      ${ev.descricao ? `<p>${ev.descricao}</p>` : ""}
      <span class="target">${tagLabel}</span>
      ${showRemove ? `<div><button class="rm" data-remove-event="${ev.id}">remover evento</button></div>` : ""}
    </div>
  `;
}

function bindCalendarNav(){
  document.querySelectorAll("[data-cal-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const delta = parseInt(btn.getAttribute("data-cal-nav"));
      state.calDate.setMonth(state.calDate.getMonth() + delta);
      render();
    });
  });
  document.querySelectorAll("[data-day]").forEach(cell=>{
    cell.addEventListener("click", ()=>{
      const key = cell.getAttribute("data-day");
      state.selectedDay = state.selectedDay === key ? null : key;
      render();
    });
  });
}

function bindEventRemoval(){
  const agenda = document.getElementById("dayAgenda");
  if(!agenda) return;
  agenda.addEventListener("click",(e)=>{
    const btn = e.target.closest("[data-remove-event]");
    if(!btn) return;
    const id = btn.getAttribute("data-remove-event");
    state.events = state.events.filter(ev=>ev.id!==id);
    scheduleSave();
    render();
    showToast('🗑️ Evento removido.');
  });
}

// Inicializar
render();

// Salvar periodicamente (a cada 10 segundos)
setInterval(() => {
  if(state.session) scheduleSave();
}, 10000);

</script>
