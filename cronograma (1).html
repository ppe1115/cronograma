    if (acceptBtn) {
      const m = state.memberships.find(x => x.id === acceptBtn.getAttribute("data-accept-invite"));
      if (m) { m.status = "approved"; scheduleSave(); render(); showToast('✅ Convite aceito!'); addLog('Aceitou convite', m.companyId); }
    }
    if (declineBtn) {
      const id = declineBtn.getAttribute("data-decline-invite");
      state.memberships = state.memberships.filter(x => x.id !== id);
      scheduleSave(); render(); showToast('❌ Recusado.');
    }
  });

  document.querySelectorAll("[data-cal-company]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.employeeActiveCompanyId = btn.getAttribute("data-cal-company");
      state.selectedDay = null;
      render();
    });
  });

  // Tarefas
  document.querySelectorAll('[data-task-filter-func]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-task-filter-func]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.taskFilter = btn.getAttribute('data-task-filter-func');
      render();
    });
  });
  document.getElementById("taskListFunc")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-complete-task]");
    if (btn) {
      const id = btn.getAttribute("data-complete-task");
      const task = state.tasks.find(t => t.id === id);
      if (task) { task.status = 'concluida'; scheduleSave(); render(); showToast('✅ Tarefa concluída!'); addLog('Concluiu tarefa', task.titulo); }
    }
  });

  // Calendário
  document.getElementById('calTodayBtn')?.addEventListener('click', () => {
    state.calDate = new Date();
    state.selectedDay = fmtDateKey(new Date());
    render();
  });
  bindCalendarNav();
  bindEventRemoval();
  bindPersonalAgendaEvents("funcionario", emp.id);
}

/* =========================================================
   CALENDÁRIO COMPARTILHADO
   ========================================================= */
function renderCalendarBlock(eventList, title) {
  const year = state.calDate.getFullYear();
  const month = state.calDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = fmtDateKey(new Date());

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-day muted"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const key = fmtDateKey(dateObj);
    const dayEvents = eventsForDay(eventList, key);
    const hasAll = dayEvents.some(e => e.tipo === "todos");
    const hasOne = dayEvents.some(e => e.tipo === "especificos");
    const classes = ["cal-day"];
    if (key === todayKey) classes.push("today");
    if (key === state.selectedDay) classes.push("selected");
    cells += `
      <div class="${classes.join(' ')}" data-day="${key}">
        <span class="num">${String(d).padStart(2, "0")}</span>
        <div class="cal-dots">
          ${hasAll ? '<span class="cal-dot dot-all"></span>' : ''}
          ${hasOne ? '<span class="cal-dot dot-one"></span>' : ''}
        </div>
      </div>`;
  }

  const selKey = state.selectedDay;
  const selEvents = selKey ? eventsForDay(eventList, selKey) : [];

  return `
    <div class="cal-head">
      <h3>${title} — ${MONTHS_PT[month]} ${year}</h3>
      <div class="cal-nav">
        <button data-cal-nav="-1">‹</button>
        <button id="calTodayBtn" style="font-size:10px;width:auto;padding:0 8px;">Hoje</button>
        <button data-cal-nav="1">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW_PT.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="legend">
      <span><span class="cal-dot dot-all"></span> Grupo inteiro</span>
      <span><span class="cal-dot dot-one"></span> Específico(s)</span>
    </div>
    <div class="agenda-title">${selKey ? "Eventos em " + fmtDatePretty(selKey) : "Selecione um dia"}</div>
    <div id="dayAgenda">
      ${selKey && selEvents.length === 0 ? '<div class="empty">Nenhum evento.</div>' : ""}
      ${selEvents.map(ev => renderEventCard(ev)).join("")}
    </div>
  `;
}

function renderEventCard(ev) {
  const isEspecifico = ev.tipo !== "todos";
  let targetLabel = "Todo o grupo";
  if (isEspecifico) {
    const nomes = ev.destinatarios.map(id => state.employees.find(e => e.id === id)?.nome || "Removido");
    targetLabel = nomes.length <= 2 ? nomes.join(" e ") : `${nomes[0]} + ${nomes.length - 1} outro(s)`;
  }
  return `
    <div class="event-card ${isEspecifico ? 'individual' : ''}">
      <div class="row">
        <h4>${ev.titulo}</h4>
        <span class="time mono">${ev.hora}</span>
      </div>
      ${ev.descricao ? `<p>${ev.descricao}</p>` : ""}
      <span class="target">${isEspecifico ? 'Para: ' + targetLabel : 'Grupo inteiro'}</span>
      ${state.role === "admin" ? `<div><button class="rm" data-remove-event="${ev.id}">remover</button></div>` : ""}
    </div>
  `;
}

function bindCalendarNav() {
  document.querySelectorAll("[data-cal-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const delta = parseInt(btn.getAttribute("data-cal-nav"));
      state.calDate.setMonth(state.calDate.getMonth() + delta);
      render();
    });
  });
  document.querySelectorAll("[data-day]").forEach(cell => {
    cell.addEventListener("click", () => {
      const key = cell.getAttribute("data-day");
      state.selectedDay = state.selectedDay === key ? null : key;
      render();
    });
  });
}

function bindEventRemoval() {
  // usado globalmente via delegação em #dayAgenda
}

/* =========================================================
   AGENDA PESSOAL
   ========================================================= */
function renderPersonalAgendaPanel(num, ownerType, ownerId) {
  const events = personalEventsOf(ownerType, ownerId);
  const selDay = state.personalSelectedDay;
  return `
  <div class="panel">
    <h3><span class="num">${num}</span>Minha agenda pessoal</h3>
    <p class="panel-note">Compromissos privados — ninguém mais vê.</p>
    <div class="personal-panel-body">
      <div class="personal-form-col">
        <label>Título</label>
        <input type="text" id="peTitulo" placeholder="Ex: Consulta médica">
        <label>Data</label>
        <input type="date" id="peData" value="${selDay || ''}" min="${fmtDateKey(new Date())}">
        ${selDay ? `<p class="ok-msg">Data ${fmtDatePretty(selDay)} preenchida.</p>` : `<p class="hint">Clique em um dia no calendário.</p>`}
        <label>Horário</label>
        <input type="time" id="peHora">
        <label>Descrição</label>
        <textarea id="peDesc" placeholder="Detalhes (opcional)"></textarea>
        <div class="err" id="peErr">Preencha título, data e horário.</div>
        <button class="btn btn-primary" id="addPersonalEventBtn">Adicionar</button>
      </div>
      <div class="personal-cal-col">
        ${renderPersonalCalendarBlock(events, "Agenda pessoal")}
      </div>
    </div>
  </div>`;
}

function renderPersonalCalendarBlock(eventList, title) {
  const year = state.personalCalDate.getFullYear();
  const month = state.personalCalDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = fmtDateKey(new Date());

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-day muted"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const key = fmtDateKey(dateObj);
    const dayEvents = eventsForDay(eventList, key);
    const has = dayEvents.length > 0;
    const classes = ["cal-day"];
    if (key === todayKey) classes.push("today");
    if (key === state.personalSelectedDay) classes.push("selected");
    cells += `
      <div class="${classes.join(' ')}" data-personal-day="${key}">
        <span class="num">${String(d).padStart(2, "0")}</span>
        <div class="cal-dots">${has ? '<span class="cal-dot dot-personal"></span>' : ''}</div>
      </div>`;
  }

  const selKey = state.personalSelectedDay;
  const selEvents = selKey ? eventsForDay(eventList, selKey) : [];
  let rightContent = selKey ? (selEvents.length ? selEvents.map(renderCompactPersonalRow).join("") : '<div class="empty">Nenhum compromisso.</div>') : '<div class="empty">Clique em um dia.</div>';

  return `
    <div class="cal-head">
      <h3>${title} — ${MONTHS_PT[month]} ${year}</h3>
      <div class="cal-nav">
        <button data-personal-cal-nav="-1">‹</button>
        <button id="personalTodayBtn" style="font-size:10px;width:auto;padding:0 8px;">Hoje</button>
        <button data-personal-cal-nav="1">›</button>
      </div>
    </div>
    <div class="personal-cal-wrap">
      <div class="personal-cal-left">
        <div class="cal-grid">
          ${DOW_PT.map(d => `<div class="cal-dow">${d}</div>`).join("")}
          ${cells}
        </div>
        <div class="legend"><span><span class="cal-dot dot-personal"></span> Compromisso pessoal</span></div>
      </div>
      <div class="personal-cal-right">
        <div class="agenda-title">${selKey ? "Compromissos em " + fmtDatePretty(selKey) : "Selecione um dia"}</div>
        <div id="personalDayAgenda">${rightContent}</div>
      </div>
    </div>
  `;
}

function renderCompactPersonalRow(ev) {
  return `
    <div class="compact-event-row">
      <div class="row-top">
        <h5>${ev.titulo}</h5>
        <span class="time mono">${ev.hora}</span>
      </div>
      ${ev.descricao ? `<p>${ev.descricao}</p>` : ""}
      <button class="rm" data-remove-personal-event="${ev.id}">remover</button>
    </div>
  `;
}

function bindPersonalAgendaEvents(ownerType, ownerId) {
  document.getElementById("addPersonalEventBtn")?.addEventListener("click", () => {
    const titulo = document.getElementById("peTitulo").value.trim();
    const data = document.getElementById("peData").value;
    const hora = document.getElementById("peHora").value;
    const desc = document.getElementById("peDesc").value.trim();
    const errBox = document.getElementById("peErr");
    if (!titulo || !data || !hora) { errBox.style.display = "block"; return; }
    errBox.style.display = "none";
    state.personalEvents.push({ id: uid(), ownerType, ownerId, titulo, data, hora, descricao: desc });
    state.personalSelectedDay = data;
    scheduleSave(); render();
    showToast('📝 Compromisso adicionado!');
  });

  document.getElementById("personalTodayBtn")?.addEventListener("click", () => {
    state.personalCalDate = new Date();
    state.personalSelectedDay = fmtDateKey(new Date());
    render();
  });

  document.querySelectorAll("[data-personal-cal-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const delta = parseInt(btn.getAttribute("data-personal-cal-nav"));
      state.personalCalDate.setMonth(state.personalCalDate.getMonth() + delta);
      render();
    });
  });
  document.querySelectorAll("[data-personal-day]").forEach(cell => {
    cell.addEventListener("click", () => {
      const key = cell.getAttribute("data-personal-day");
      state.personalSelectedDay = state.personalSelectedDay === key ? null : key;
      render();
    });
  });
  document.getElementById("personalDayAgenda")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove-personal-event]");
    if (!btn) return;
    const id = btn.getAttribute("data-remove-personal-event");
    state.personalEvents = state.personalEvents.filter(ev => ev.id !== id);
    scheduleSave(); render();
    showToast('🗑️ Compromisso removido.');
  });
}
